<rect x="104" y="547" width="106" height="24" rx="12" fill="#163a61"/><text x="157" y="563" text-anchor="middle" class="t w xs h">JWT staff</text>
<rect x="220" y="547" width="118" height="24" rx="12" fill="#163a61"/><text x="279" y="563" text-anchor="middle" class="t w xs h">Bearer</text>
<rect x="348" y="547" width="130" height="24" rx="12" fill="#163a61"/><text x="413" y="563" text-anchor="middle" class="t w xs h">900 segundos</text>
<rect x="488" y="547" width="132" height="24" rx="12" fill="#163a61"/><text x="554" y="563" text-anchor="middle" class="t w xs h">Sin refresh</text>
<rect x="630" y="547" width="228" height="24" rx="12" fill="#163a61"/><text x="744" y="563" text-anchor="middle" class="t w xs h">Permisos derivados del rol</text>
