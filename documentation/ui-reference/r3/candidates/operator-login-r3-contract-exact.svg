<text x="132" y="365" class="t w lab">Operador de siniestros</text><text x="100" y="393" class="t w xs" opacity=".72">Workspace operativo</text>
<text x="100" y="415" class="t w xs" opacity=".72">Claims · Tareas · Clientes · Pólizas</text><text x="100" y="438" class="t w xs h">Destino habitual: Dashboard</text>
