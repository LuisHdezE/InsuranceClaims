<text x="104" y="649" class="t w sm h">Navegación después del login</text>
<text x="104" y="675" class="t w sm" opacity=".76">Si la sesión venía de una ruta protegida y el rol puede acceder, R3 vuelve a esa ruta.</text>
<text x="104" y="700" class="t w sm" opacity=".76">Si no, aplica el destino seguro del rol. No existe selector manual de rol.</text>
<text x="104" y="723" class="t w xs" opacity=".58">Autenticación fallida se presenta mediante Problem Details; la contraseña se limpia tras éxito.</text>
<g filter="url(#sh)"><rect x="1020" y="95" width="500" height="705" rx="24" fill="#fff"/></g>
