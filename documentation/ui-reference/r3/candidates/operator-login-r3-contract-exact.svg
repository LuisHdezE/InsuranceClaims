<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#071727"/>
    <stop offset="0.62" stop-color="#10243d"/>
    <stop offset="1" stop-color="#17345a"/>
  </linearGradient>
  <linearGradient id="soft" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#eef6ff"/>
    <stop offset="1" stop-color="#f8fbff"/>
  </linearGradient>
  <filter id="sh"><feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#071727" flood-opacity=".18"/></filter>
  <style>
    .t{font-family:Arial,Helvetica,sans-serif;fill:#10233d}.w{fill:#fff}.muted{fill:#60738d}
    .xs{font-size:11px}.sm{font-size:12px}.body{font-size:14px}.lab{font-size:14px;font-weight:700}
    .sec{font-size:18px;font-weight:700}.title{font-size:34px;font-weight:760}.h{font-weight:700}.mono{font-family:Consolas,monospace}
  </style>
</defs>
<rect width="1600" height="900" fill="#f4f8fc"/>
