<text x="370" y="415" class="t w xs" opacity=".72">Incluye Analytics y acciones bulk</text><text x="370" y="438" class="t w xs h">Destino habitual: Dashboard</text>
<circle cx="648" cy="359" r="15" fill="#8359d5"/><text x="648" y="364" text-anchor="middle" class="t w xs h">PA</text>
<text x="672" y="365" class="t w lab">Administrador de plataforma</text><text x="640" y="393" class="t w xs" opacity=".72">Configuración y recuperación</text>
<text x="640" y="415" class="t w xs" opacity=".72">Sin operación Claims implícita</text><text x="640" y="438" class="t w xs h">Destino habitual: Workspace</text>
