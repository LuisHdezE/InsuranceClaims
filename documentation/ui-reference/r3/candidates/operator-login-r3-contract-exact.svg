<path d="M88 89l18 7v15c0 14-9 23-18 29-9-6-18-15-18-29V96z" fill="none" stroke="#fff" stroke-width="3"/>
<text x="130" y="106" class="t w" font-size="26" font-weight="700">FAR Seguros</text>
<text x="130" y="128" class="t w sm" opacity=".72">InsuranceClaims · Operations R3</text>
<text x="80" y="244" class="t w" font-size="44" font-weight="760">Acceso seguro del equipo</text>
<text x="80" y="280" class="t w body" opacity=".78">Un único ingreso. El API determina el rol y la navegación autorizada.</text>
