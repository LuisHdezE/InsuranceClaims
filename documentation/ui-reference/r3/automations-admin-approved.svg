    <rect x="240" y="160" width="250" height="74" rx="10" fill="#ffffff" stroke="#dbe6f2"/><text x="260" y="185" font-size="12" fill="#66798f">Definiciones</text><text x="260" y="215" font-size="26" font-weight="700" fill="#10233a">18</text>
