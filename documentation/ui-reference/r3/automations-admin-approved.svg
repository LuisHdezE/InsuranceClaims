    <rect x="770" y="160" width="250" height="74" rx="10" fill="#ffffff" stroke="#dbe6f2"/><text x="790" y="185" font-size="12" fill="#66798f">Con versión activa</text><text x="790" y="215" font-size="26" font-weight="700" fill="#0a6df2">15</text>
    <rect x="1035" y="160" width="335" height="74" rx="10" fill="#ffffff" stroke="#dbe6f2"/><text x="1055" y="185" font-size="12" fill="#66798f">Contrato</text><text x="1055" y="210" font-size="14" font-weight="700" fill="#10233a">6 triggers · 8 acciones</text>
