  <rect x="992" y="418" width="356" height="96" rx="8" fill="#fafbfc" stroke="#e2eaf2"/><text x="1008" y="442" font-family="Arial" font-size="11" fill="#55708b">SI</text><text x="1008" y="468" font-family="Arial" font-size="13" fill="#14365b">renewal.days_to_due IN [30, 15, 7]</text><text x="1008" y="492" font-family="Arial" font-size="13" fill="#14365b">renewal.status EQ OPEN</text>
  <rect x="992" y="528" width="356" height="66" rx="8" fill="#fff9ec"/><text x="1008" y="552" font-family="Arial" font-size="11" fill="#7d6a42">ESPERA</text><text x="1008" y="578" font-family="Arial" font-size="14" font-weight="700" fill="#8a6500">60 segundos</text>
  <rect x="992" y="608" width="356" height="124" rx="8" fill="#f2fbf6"/><text x="1008" y="632" font-family="Arial" font-size="11" fill="#55708b">ENTONCES</text><text x="1008" y="658" font-family="Arial" font-size="13" font-weight="700" fill="#16794a">NOTIFY_OPERATOR</text><text x="1008" y="685" font-family="Arial" font-size="13" font-weight="700" fill="#16794a">CREATE_TASK</text><text x="1008" y="712" font-family="Arial" font-size="13" font-weight="700" fill="#16794a">SCHEDULE_CHECK</text>
  <rect x="992" y="754" width="166" height="40" rx="8" fill="#0a6df2"/><text x="1031" y="779" font-family="Arial" font-size="13" font-weight="700" fill="#fff">Nueva versión</text><rect x="1170" y="754" width="178" height="40" rx="8" fill="#ffffff" stroke="#b7c8db"/><text x="1212" y="779" font-family="Arial" font-size="13" font-weight="700" fill="#14365b">Deshabilitar</text>
