name: R3 Analytics Workspace Visual Review V1

on:
  push:
    branches: [review/r3-ui-increment-07-analytics-workspace-v1]

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: insuranceclaims_r3_increment07_review_v1
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d insuranceclaims_r3_increment07_review_v1"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/insuranceclaims_r3_increment07_review_v1
      LEGACY_SIMULATOR_URL: http://127.0.0.1:3200
      LEGACY_SIMULATOR_PORT: '3200'
      PORT: '3000'
      QA_BASE_URL: http://127.0.0.1:3000
      QA_WEB_BASE_URL: http://127.0.0.1:5173
      QA_SUPERVISOR_LOGIN: qa.supervisor@example.invalid
      QA_ADMIN_LOGIN: qa.admin@example.invalid
      QA_CUSTOMER_LOGIN: qa.customer@example.invalid
      JWT_SECRET: review-${{ github.run_id }}-${{ github.sha }}-jwt
      CUSTOMER_JWT_SECRET: review-${{ github.run_id }}-${{ github.sha }}-customer-jwt
      QA_OPERATOR_PASSWORD: Review-${{ github.run_id }}-${{ github.run_attempt }}-Aa1!
      QA_CUSTOMER_PASSWORD: Customer-${{ github.run_id }}-${{ github.run_attempt }}-Aa1!
      REVIEW_TARGET_SHA: 439562d69a6a42121143c67cc6ff4fa91dfbc503

    steps:
      - name: Checkout exact product head
        uses: actions/checkout@v7
        with:
          ref: 439562d69a6a42121143c67cc6ff4fa91dfbc503
      - name: Checkout review harness separately
        uses: actions/checkout@v7
        with:
          ref: review/r3-ui-increment-07-analytics-workspace-v1
          path: .review-harness
          sparse-checkout: qa/r3_increment07_visual_review.py
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: npm ci
      - run: npm run contract:emit
      - name: Prepare browser runtime
        shell: bash
        run: |
          command -v psql >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y postgresql-client; }
          python -m pip install --disable-pip-version-check selenium==4.35.0
          browser_bin="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$browser_bin"
          echo "BROWSER_BIN=$browser_bin" >> "$GITHUB_ENV"
      - name: Bootstrap canonical R3 data
        shell: bash
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f qa/bootstrap.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f prisma/migrations/20260909_01_renewals_r3.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f prisma/migrations/20260909_02_collections_r3.sql
          npx tsx qa/seed.ts
      - name: Start services
        shell: bash
        run: |
          mkdir -p .runtime/increment07-review-v1
          npm run start:legacy > .runtime/r3-increment07-v1-legacy.log 2>&1 &
          npm run start:api > .runtime/r3-increment07-v1-api.log 2>&1 &
          npm run dev --workspace=@insurance/web -- --host 127.0.0.1 > .runtime/r3-increment07-v1-web.log 2>&1 &
          for attempt in $(seq 1 50); do
            legacy_ok=0; api_ok=0; web_ok=0
            curl -fsS -X POST -H 'content-type: application/json' -d '{"policy_no":"SYN-POL-001","vehicle_ref":"SYN-VEH-001"}' http://127.0.0.1:3200/legacy/v1/policy-vehicle/verify >/dev/null 2>&1 && legacy_ok=1 || true
            curl -fsS http://127.0.0.1:3000/health/live >/dev/null 2>&1 && api_ok=1 || true
            curl -fsS http://127.0.0.1:5173/ >/dev/null 2>&1 && web_ok=1 || true
            [[ "$legacy_ok" == 1 && "$api_ok" == 1 && "$web_ok" == 1 ]] && exit 0
            sleep 1
          done
          cat .runtime/r3-increment07-v1-api.log || true
          cat .runtime/r3-increment07-v1-web.log || true
          exit 1
      - name: Verify direct protected Analytics contract
        shell: bash
        run: |
          response=$(curl -fsS -X POST -H 'content-type: application/json' -d "{\"login\":\"$QA_SUPERVISOR_LOGIN\",\"password\":\"$QA_OPERATOR_PASSWORD\"}" http://127.0.0.1:3000/api/v1/operator/auth/login)
          token=$(node -e 'const x=JSON.parse(process.argv[1]);if(x.operator?.role!=="CLAIMS_SUPERVISOR"||!x.accessToken)process.exit(1);process.stdout.write(x.accessToken)' "$response")
          from=$(node -e 'process.stdout.write(new Date(Date.now()-30*86400000).toISOString())')
          to=$(node -e 'process.stdout.write(new Date().toISOString())')
          analytics=$(curl -fsS -G -H "Authorization: Bearer $token" --data-urlencode "from=$from" --data-urlencode "to=$to" http://127.0.0.1:3000/api/v1/operator/analytics/claims)
          node -e 'const x=JSON.parse(process.argv[1]);const keys=["window","generatedAt","openClaims","reportedInWindow","claimsByStatus","claimsByOperationalStage","evidencePendingReviewClaims","openTasks","overdueTasks","closedClaims"];if(!keys.every(k=>Object.prototype.hasOwnProperty.call(x,k)))process.exit(1);const statuses=["RECEIVED","UNDER_REVIEW","OBSERVED","APPROVED","IN_REPAIR","CLOSED"];if(!statuses.every(s=>Object.prototype.hasOwnProperty.call(x.claimsByStatus||{},s)))process.exit(1);console.log(JSON.stringify({event:"ANALYTICS_CONTRACT_OK",openClaims:x.openClaims,reportedInWindow:x.reportedInWindow,closedClaims:x.closedClaims}))' "$analytics"
      - name: Capture exact-head Analytics and Workspace views
        run: python .review-harness/qa/r3_increment07_visual_review.py
      - name: Upload exact-head visual evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: r3-analytics-workspace-v1-439562d69a6a42121143c67cc6ff4fa91dfbc503
          path: |
            .runtime/increment07-review-v1/*.png
            .runtime/increment07-review-v1/increment07-visual-review.json
          if-no-files-found: warn
          retention-days: 14
