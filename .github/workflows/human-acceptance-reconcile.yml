name: Reconcile Human Acceptance

on:
  push:
    branches:
      - blueprint/human-acceptance-web
    paths:
      - .github/workflows/human-acceptance-reconcile.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: blueprint/human-acceptance-web
          fetch-depth: 0
      - name: Reconcile Blueprint checkpoint
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.blueprint/status.yaml')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  "updated_at: '2026-09-06T22:56:00-03:00'",
                  "updated_at: '2026-09-06T23:15:34-03:00'",
              ),
              (
                  "    note: digital-claim-intake/web, customer-claim-tracking/web and claims-backoffice/web are all FUNCTIONAL after explicit human Functional Slice Ready approvals and exact reviewed-head validation.",
                  "    note: digital-claim-intake/web, customer-claim-tracking/web and claims-backoffice/web are all ACCEPTED after explicit Human Acceptance with Functional DoD, Visual & Functional Review and Integration QA already PASS.",
              ),
          ]

          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'Expected exactly one checkpoint anchor: {old!r}')
              text = text.replace(old, new, 1)

          artifact_anchor = """  - id: EVD-INTEGRATION-QA-BACKOFFICE-WEB-APPROVAL-001
    type: manual_approval
    value: documentation/integration-qa/CLAIMS_BACKOFFICE_WEB_APPROVAL.md
"""
          artifact_append = artifact_anchor + """  - id: EVD-HUMAN-ACCEPTANCE-INTAKE-WEB-001
    type: manual_approval
    value: documentation/human-acceptance/DIGITAL_CLAIM_INTAKE_WEB_APPROVAL.md
  - id: EVD-HUMAN-ACCEPTANCE-TRACKING-WEB-001
    type: manual_approval
    value: documentation/human-acceptance/CUSTOMER_CLAIM_TRACKING_WEB_APPROVAL.md
  - id: EVD-HUMAN-ACCEPTANCE-BACKOFFICE-WEB-001
    type: manual_approval
    value: documentation/human-acceptance/CLAIMS_BACKOFFICE_WEB_APPROVAL.md
"""
          if text.count(artifact_anchor) != 1:
              raise SystemExit('Expected exactly one Integration QA approval artifact anchor')
          if 'EVD-HUMAN-ACCEPTANCE-INTAKE-WEB-001' in text:
              raise SystemExit('Human Acceptance artifacts already present; refusing duplicate reconciliation')
          text = text.replace(artifact_anchor, artifact_append, 1)

          if 'release_gate:' in text:
              raise SystemExit('Release Gate must not be started by Human Acceptance reconciliation')

          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit reconciled checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .blueprint/status.yaml
          git diff --cached --check
          git commit -m "chore(blueprint): record human acceptance"
          git push origin HEAD:blueprint/human-acceptance-web
