name: R3 Full Product Technical Closure

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-product-technical-closure:
    name: Full Product Technical Closure
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Emit contract
        run: npm run contract:emit

      - name: Backend typecheck
        run: npm run typecheck

      - name: Backend production build
        run: npm run build

      - name: Backend tests
        run: npm test

      - name: Architecture conformance
        run: npm run architecture:check

      - name: Web strict typecheck
        run: npm run typecheck --workspace=@insurance/web

      - name: Web tests
        run: npm test --workspace=@insurance/web

      - name: Web production build
        run: npm run build --workspace=@insurance/web

      - name: R3 runtime reconciliation
        run: npm run api:reconcile:r3

      - name: OpenAPI R3 zero drift
        run: npm run openapi:check:r3

      - name: Postman R3 zero drift
        run: npm run postman:check:r3

      - name: Revalidate inherited API R3 closure
        run: npm run r3:closure:validate

      - name: Validate full-product closure boundary
        run: npm run r3:product-closure:validate
