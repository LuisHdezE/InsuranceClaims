name: Reconcile Client Architecture Ready Approval

on:
  push:
    branches: [blueprint/client-architecture]
    paths:
      - .github/workflows/client-architecture-ready-approval-reconcile.yml

permissions:
  contents: write

jobs:
  reconcile:
    if: github.ref_name == 'blueprint/client-architecture'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: blueprint/client-architecture
          fetch-depth: 0
      - name: Reconcile only Client Architecture Ready approval status
        shell: python
        run: |
          from pathlib import Path
          import os, re

          path = Path('.blueprint/status.yaml')
          text = path.read_text()
          original = text

          timestamp = os.popen("TZ=America/Montevideo date --iso-8601=seconds").read().strip()
          text, n = re.subn(r"updated_at: '[^']+'", f"updated_at: '{timestamp}'", text, count=1)
          assert n == 1

          old_phase = """  client_architecture:\n    status: READY_FOR_REVIEW\n    progress: 100\n    note: Reusable web platform baseline and three exact slice/platform bindings are semantically validated; explicit human Client Architecture Ready decisions remain pending.\n"""
          new_phase = """  client_architecture:\n    status: COMPLETE\n    progress: 100\n    note: Reusable web platform baseline and all three exact web slice bindings were explicitly approved by Luis Hernández after exact-head semantic validation and full regression success.\n"""
          assert old_phase in text, 'expected Client Architecture READY_FOR_REVIEW phase not found'
          text = text.replace(old_phase, new_phase, 1)

          replacements = [
            (
              """  - gate: client_architecture_ready\n    scope: interface_slice_platform\n    scope_id: digital-claim-intake\n    platform: web\n    status: READY_FOR_REVIEW\n    note: Platform baseline plus digital-claim-intake/web binding passes semantic validation; explicit human scoped approval remains pending.\n    evidence_ids: [EVD-CLIENT-PLATFORM-WEB-001, EVD-CLIENT-INTAKE-WEB-001, EVD-CLIENT-ARCH-EVIDENCE-001, EVD-CLIENT-ARCH-VALIDATION-001]\n""",
              f"""  - gate: client_architecture_ready\n    scope: interface_slice_platform\n    scope_id: digital-claim-intake\n    platform: web\n    status: PASS\n    evaluated_at: '{timestamp}'\n    note: Explicit human Client Architecture Ready approval recorded for digital-claim-intake/web after exact-head semantic validation and full regression success.\n    evidence_ids: [EVD-CLIENT-PLATFORM-WEB-001, EVD-CLIENT-INTAKE-WEB-001, EVD-CLIENT-ARCH-EVIDENCE-001, EVD-CLIENT-ARCH-VALIDATION-001, EVD-CLIENT-ARCH-READY-APPROVAL-001]\n"""
            ),
            (
              """  - gate: client_architecture_ready\n    scope: interface_slice_platform\n    scope_id: customer-claim-tracking\n    platform: web\n    status: READY_FOR_REVIEW\n    note: Platform baseline plus customer-claim-tracking/web binding passes semantic validation; explicit human scoped approval remains pending.\n    evidence_ids: [EVD-CLIENT-PLATFORM-WEB-001, EVD-CLIENT-TRACKING-WEB-001, EVD-CLIENT-ARCH-EVIDENCE-001, EVD-CLIENT-ARCH-VALIDATION-001]\n""",
              f"""  - gate: client_architecture_ready\n    scope: interface_slice_platform\n    scope_id: customer-claim-tracking\n    platform: web\n    status: PASS\n    evaluated_at: '{timestamp}'\n    note: Explicit human Client Architecture Ready approval recorded for customer-claim-tracking/web after exact-head semantic validation and full regression success.\n    evidence_ids: [EVD-CLIENT-PLATFORM-WEB-001, EVD-CLIENT-TRACKING-WEB-001, EVD-CLIENT-ARCH-EVIDENCE-001, EVD-CLIENT-ARCH-VALIDATION-001, EVD-CLIENT-ARCH-READY-APPROVAL-001]\n"""
            ),
            (
              """  - gate: client_architecture_ready\n    scope: interface_slice_platform\n    scope_id: claims-backoffice\n    platform: web\n    status: READY_FOR_REVIEW\n    note: Platform baseline plus claims-backoffice/web binding passes semantic validation; explicit human scoped approval remains pending.\n    evidence_ids: [EVD-CLIENT-PLATFORM-WEB-001, EVD-CLIENT-BACKOFFICE-WEB-001, EVD-CLIENT-ARCH-EVIDENCE-001, EVD-CLIENT-ARCH-VALIDATION-001]\n""",
              f"""  - gate: client_architecture_ready\n    scope: interface_slice_platform\n    scope_id: claims-backoffice\n    platform: web\n    status: PASS\n    evaluated_at: '{timestamp}'\n    note: Explicit human Client Architecture Ready approval recorded for claims-backoffice/web after exact-head semantic validation and full regression success.\n    evidence_ids: [EVD-CLIENT-PLATFORM-WEB-001, EVD-CLIENT-BACKOFFICE-WEB-001, EVD-CLIENT-ARCH-EVIDENCE-001, EVD-CLIENT-ARCH-VALIDATION-001, EVD-CLIENT-ARCH-READY-APPROVAL-001]\n"""
            )
          ]

          for old, new in replacements:
            assert old in text, 'expected scoped Client Architecture READY_FOR_REVIEW block not found'
            text = text.replace(old, new, 1)

          artifact_anchor = """  - id: EVD-CLIENT-ARCH-VALIDATION-001\n    type: client_architecture_validation_evidence\n    value: documentation/client-architecture/CLIENT_ARCHITECTURE_VALIDATION_EVIDENCE.md\n"""
          artifact_addition = artifact_anchor + """  - id: EVD-CLIENT-ARCH-READY-APPROVAL-001\n    type: manual_approval\n    value: documentation/client-architecture/CLIENT_ARCHITECTURE_READY_APPROVAL.md\n"""
          assert artifact_anchor in text, 'expected Client Architecture validation artifact anchor not found'
          assert 'EVD-CLIENT-ARCH-READY-APPROVAL-001' not in original, 'approval evidence already existed unexpectedly'
          text = text.replace(artifact_anchor, artifact_addition, 1)

          assert text != original
          path.write_text(text)
      - name: Verify approval-only status change
        run: |
          git diff -- .blueprint/status.yaml
          git diff -- .blueprint/status.yaml | grep -q 'client_architecture:'
          test "$(git diff -- .blueprint/status.yaml | grep -c '^+    status: PASS')" -eq 3
          git diff -- .blueprint/status.yaml | grep -q 'EVD-CLIENT-ARCH-READY-APPROVAL-001'
      - name: Commit approved Client Architecture status
        run: |
          git config user.name "MSc Luis A. Hernández Elias"
          git config user.email "88979457+LuisHdezE@users.noreply.github.com"
          git add .blueprint/status.yaml
          git commit -m "chore: mark scoped Client Architecture approved"
          git push origin HEAD:blueprint/client-architecture
