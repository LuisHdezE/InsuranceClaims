name: Reconcile Operations State

on:
  push:
    branches: [blueprint/operations-observability]
    paths: [.github/workflows/reconcile-operations-state.yml]

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: blueprint/operations-observability
          fetch-depth: 0

      - name: Reconcile canonical Operations state
        shell: bash
        run: |
          export NOW="$(TZ=America/Montevideo date '+%Y-%m-%dT%H:%M:%S-03:00')"
          python - <<'PY'
          from pathlib import Path
          import os

          path = Path('.blueprint/status.yaml')
          text = path.read_text()
          now = os.environ['NOW']

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one anchor, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              "updated_at: '2026-09-07T05:09:00-03:00'",
              f"updated_at: '{now}'",
              'updated_at',
          )

          release_phase = """  release_gate:\n    status: COMPLETE\n    progress: 100\n    note: Explicit human Release Gate approval recorded on 2026-09-07 after all four applicable release checks and 16/16 exact-head PR workflows passed for candidate 05bb93081248c02ecfb93b7b77477bd4862d3281.\n"""
          operations_phase = release_phase + """  operations:\n    status: COMPLETE\n    progress: 100\n    note: Repository-local Operations & Maintenance baseline completed after executable observability evidence; no FAR production infrastructure, SLO/SLA, centralized monitoring or on-call topology is claimed.\n"""
          replace_once(release_phase, operations_phase, 'operations phase')

          release_check = """  release.backup_restore:\n    status: PASS\n    verification: evidence\n    note: PostgreSQL 18 pg_dump/pg_restore proof restored six authoritative tables and verified synthetic claim, audit and idempotency sentinels in a distinct database.\n    evidence_ids: [EVD-RELEASE-GATE-001]\n"""
          operations_check = release_check + """  operations.observability:\n    status: PASS\n    verification: evidence\n    note: Real API/PostgreSQL/legacy-simulator runtime proof validates health endpoints, X-Request-Id correlation, safe Problem Details, durable audit correlation and absence of synthetic QA secrets in service logs.\n    evidence_ids: [EVD-OPERATIONS-OBSERVABILITY-001]\n"""
          replace_once(release_check, operations_check, 'operations observability check')

          release_artifact = """  - id: EVD-RELEASE-GATE-APPROVAL-001\n    type: manual_approval\n    value: documentation/release/RELEASE_GATE_APPROVAL.md\n"""
          operations_artifact = release_artifact + """  - id: EVD-OPERATIONS-OBSERVABILITY-001\n    type: operations_observability_evidence\n    value: documentation/operations/OPERATIONS_OBSERVABILITY_EVIDENCE.md\n"""
          replace_once(release_artifact, operations_artifact, 'operations artifact')

          path.write_text(text)
          PY

      - name: Remove one-time reconciler and publish state
        shell: bash
        run: |
          git rm .github/workflows/reconcile-operations-state.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .blueprint/status.yaml
          git commit -m 'chore(blueprint): record Operations observability'
          git push origin HEAD:blueprint/operations-observability
