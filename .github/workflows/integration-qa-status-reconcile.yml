name: Reconcile Integration QA Ready State

on:
  push:
    branches: [blueprint/integration-qa-web]
    paths:
      - .github/workflows/integration-qa-status-reconcile.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: blueprint/integration-qa-web
          fetch-depth: 0

      - name: Reconcile Blueprint checkpoint
        shell: bash
        run: |
          python - <<'PY'
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          import re

          path = Path('.blueprint/status.yaml')
          text = path.read_text(encoding='utf-8')

          forbidden = [
              '\n  integration_qa:\n',
              '\n  qa.functional:\n',
              '\n  - gate: integration_qa_pass\n',
              'EVD-INTEGRATION-QA-WEB-SYSTEM-001',
          ]
          for marker in forbidden:
              if marker in text:
                  raise SystemExit(f'Integration QA status marker already exists: {marker!r}')

          now = datetime.now(ZoneInfo('America/Montevideo')).replace(microsecond=0).isoformat()
          text, count = re.subn(
              r"updated_at: '[^']+'",
              f"updated_at: '{now}'",
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('updated_at anchor did not match exactly once')

          phase_anchor = """  visual_functional_review:\n    status: COMPLETE\n    progress: 100\n    note: digital-claim-intake/web, customer-claim-tracking/web and claims-backoffice/web all passed Visual & Functional Review after real-browser evidence and explicit human approval on the exact reviewed candidate.\nchecks:\n"""
          phase_replacement = """  visual_functional_review:\n    status: COMPLETE\n    progress: 100\n    note: digital-claim-intake/web, customer-claim-tracking/web and claims-backoffice/web all passed Visual & Functional Review after real-browser evidence and explicit human approval on the exact reviewed candidate.\n  integration_qa:\n    status: READY_FOR_REVIEW\n    progress: 89\n    note: All three web slices passed the applicable machine/evidence Integration QA checks against real API transport, PostgreSQL 18 and the simulated legacy dependency; explicit human review remains pending per slice/platform.\nchecks:\n"""
          if text.count(phase_anchor) != 1:
              raise SystemExit('phase anchor mismatch')
          text = text.replace(phase_anchor, phase_replacement, 1)

          checks_anchor = """  review.human_complete:\n    status: PASS\n    verification: manual\n    note: Luis Hernández explicitly approved Visual & Functional Review for all three scoped web slices on the exact PR #17 reviewed head; CI did not infer this decision.\n    evidence_ids: [EVD-VFR-INTAKE-WEB-APPROVAL-001, EVD-VFR-TRACKING-WEB-APPROVAL-001, EVD-VFR-BACKOFFICE-WEB-APPROVAL-001]\ngates:\n"""
          ev_all = '[EVD-INTEGRATION-QA-WEB-SYSTEM-001, EVD-INTEGRATION-QA-INTAKE-WEB-001, EVD-INTEGRATION-QA-TRACKING-WEB-001, EVD-INTEGRATION-QA-BACKOFFICE-WEB-001]'
          qa_checks = f"""  review.human_complete:\n    status: PASS\n    verification: manual\n    note: Luis Hernández explicitly approved Visual & Functional Review for all three scoped web slices on the exact PR #17 reviewed head; CI did not infer this decision.\n    evidence_ids: [EVD-VFR-INTAKE-WEB-APPROVAL-001, EVD-VFR-TRACKING-WEB-APPROVAL-001, EVD-VFR-BACKOFFICE-WEB-APPROVAL-001]\n  qa.functional:\n    status: PASS\n    verification: evidence\n    note: All three scoped web slices preserve their approved functional behavior in the integrated runtime.\n    evidence_ids: {ev_all}\n  qa.real_api_transport:\n    status: PASS\n    verification: evidence\n    note: Each web slice executes its canonical Axios client against the production Nest API composition with PostgreSQL 18 and the simulated legacy HTTP dependency.\n    evidence_ids: {ev_all}\n  qa.integration:\n    status: PASS\n    verification: evidence\n    note: The integrated browser journey and real-client runtimes carry authoritative synthetic claim data from intake through tracking and protected backoffice without direct React access to DB, MCP or legacy.\n    evidence_ids: {ev_all}\n  qa.security:\n    status: PASS\n    verification: evidence\n    note: Authentication, authorization, proof redaction, protected evidence, rate limiting, durable audit, stale-state concurrency and production dependency checks pass in the integrated runtime.\n    evidence_ids: {ev_all}\n  qa.responsive:\n    status: PASS\n    verification: evidence\n    note: Real Chrome responsive checks pass for all three scoped web slices without horizontal page overflow on the reviewed surfaces.\n    evidence_ids: {ev_all}\n  qa.accessibility:\n    status: PASS\n    verification: evidence\n    note: Automated real-browser accessibility checks pass across the integrated journey for all three scoped web slices.\n    evidence_ids: {ev_all}\n  qa.e2e:\n    status: PASS\n    verification: evidence\n    note: Real-browser and real-client end-to-end evidence covers intake, customer tracking and protected backoffice against the same authoritative runtime.\n    evidence_ids: {ev_all}\n  qa.idempotency:\n    status: PASS\n    verification: evidence\n    note: digital-claim-intake/web proves createClaim Idempotency-Key replay semantics; customer tracking and backoffice are correctly N/A, with expectedFromStatus retained as the backoffice concurrency guard.\n    evidence_ids: [EVD-INTEGRATION-QA-WEB-SYSTEM-001, EVD-INTEGRATION-QA-INTAKE-WEB-001, EVD-INTEGRATION-QA-BACKOFFICE-WEB-001]\n  qa.offline:\n    status: PASS\n    verification: evidence\n    note: CDP transport blocking proves all three loaded web slices fail closed when /api transport is unavailable and do not substitute local authoritative business state.\n    evidence_ids: {ev_all}\ngates:\n"""
          if text.count(checks_anchor) != 1:
              raise SystemExit('checks anchor mismatch')
          text = text.replace(checks_anchor, qa_checks, 1)

          scoped_anchor = """blockers: []\napi_impacts: []\nartifacts:\n"""
          scoped = f"""  - gate: integration_qa_pass\n    scope: interface_slice_platform\n    scope_id: digital-claim-intake\n    platform: web\n    status: READY_FOR_REVIEW\n    evaluated_at: '{now}'\n    note: All applicable Integration QA checks pass against the real-dependency candidate; explicit human review remains pending.\n    evidence_ids: [EVD-INTEGRATION-QA-WEB-SYSTEM-001, EVD-INTEGRATION-QA-INTAKE-WEB-001]\n  - gate: integration_qa_pass\n    scope: interface_slice_platform\n    scope_id: customer-claim-tracking\n    platform: web\n    status: READY_FOR_REVIEW\n    evaluated_at: '{now}'\n    note: All applicable Integration QA checks pass against the real-dependency candidate; idempotency is N/A and explicit human review remains pending.\n    evidence_ids: [EVD-INTEGRATION-QA-WEB-SYSTEM-001, EVD-INTEGRATION-QA-TRACKING-WEB-001]\n  - gate: integration_qa_pass\n    scope: interface_slice_platform\n    scope_id: claims-backoffice\n    platform: web\n    status: READY_FOR_REVIEW\n    evaluated_at: '{now}'\n    note: All applicable Integration QA checks pass against the real-dependency candidate; expectedFromStatus remains the concurrency guard, idempotency is N/A, and explicit human review remains pending.\n    evidence_ids: [EVD-INTEGRATION-QA-WEB-SYSTEM-001, EVD-INTEGRATION-QA-BACKOFFICE-WEB-001]\nblockers: []\napi_impacts: []\nartifacts:\n"""
          if text.count(scoped_anchor) != 1:
              raise SystemExit('scoped-gate anchor mismatch')
          text = text.replace(scoped_anchor, scoped, 1)

          artifacts = """  - id: EVD-INTEGRATION-QA-WEB-SYSTEM-001\n    type: integration_qa_system_evidence\n    value: documentation/integration-qa/INTEGRATION_QA_WEB_SYSTEM_EVIDENCE.md\n  - id: EVD-INTEGRATION-QA-INTAKE-WEB-001\n    type: integration_qa_evidence\n    value: documentation/integration-qa/DIGITAL_CLAIM_INTAKE_WEB_EVIDENCE.md\n  - id: EVD-INTEGRATION-QA-TRACKING-WEB-001\n    type: integration_qa_evidence\n    value: documentation/integration-qa/CUSTOMER_CLAIM_TRACKING_WEB_EVIDENCE.md\n  - id: EVD-INTEGRATION-QA-BACKOFFICE-WEB-001\n    type: integration_qa_evidence\n    value: documentation/integration-qa/CLAIMS_BACKOFFICE_WEB_EVIDENCE.md\n"""
          text = text.rstrip() + '\n' + artifacts
          path.write_text(text, encoding='utf-8')
          print(f'Integration QA READY_FOR_REVIEW reconciled at {now}')
          PY

      - name: Commit reconciled checkpoint
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .blueprint/status.yaml
          git diff --cached --check
          git diff --cached --quiet && { echo 'No reconciliation change produced' >&2; exit 1; }
          git commit -m 'chore(blueprint): reconcile Integration QA ready state'
          git push origin HEAD:blueprint/integration-qa-web
