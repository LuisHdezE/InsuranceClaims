name: Reconcile Tracking Functional Slice Approval

on:
  push:
    branches: [blueprint/functional-slice-customer-claim-tracking-web]
    paths:
      - .github/workflows/functional-slice-tracking-approval-reconcile.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: blueprint/functional-slice-customer-claim-tracking-web
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Reconcile approved scoped Blueprint status
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = '.blueprint/status.yaml';
          let text = fs.readFileSync(file, 'utf8');
          const replaceOnce = (from, to, label) => {
            const first = text.indexOf(from);
            const last = text.lastIndexOf(from);
            if (first < 0 || first !== last) throw new Error(`Expected one ${label} anchor`);
            text = text.replace(from, to);
          };

          replaceOnce(
            "updated_at: '2026-09-06T07:55:00-03:00'",
            "updated_at: '2026-09-06T08:02:07-03:00'",
            'updated_at',
          );

          replaceOnce(
            "  functional_interface_slice:\n    status: IN_PROGRESS\n    progress: 33\n    note: digital-claim-intake/web is FUNCTIONAL; customer-claim-tracking/web is READY_FOR_REVIEW after exact-head functional, real-API, privacy, responsive and accessibility validation; claims-backoffice/web remains pending.\nchecks:",
            "  functional_interface_slice:\n    status: IN_PROGRESS\n    progress: 67\n    note: digital-claim-intake/web and customer-claim-tracking/web are FUNCTIONAL after explicit human Functional Slice Ready approvals and exact reviewed-head validation; claims-backoffice/web remains pending.\nchecks:",
            'functional phase',
          );

          replaceOnce(
            "  - gate: functional_slice_ready\n    scope: interface_slice_platform\n    scope_id: customer-claim-tracking\n    platform: web\n    status: READY_FOR_REVIEW\n    note: All canonical tracking functional slice checks are evidenced against the real API-backed web client; idempotency is explicitly N/A for trackClaim and human approval remains pending before lifecycle FUNCTIONAL.\n    evidence_ids: [EVD-FUNCTIONAL-TRACKING-WEB-001]\nblockers: []",
            "  - gate: functional_slice_ready\n    scope: interface_slice_platform\n    scope_id: customer-claim-tracking\n    platform: web\n    status: PASS\n    evaluated_at: '2026-09-06T08:02:07-03:00'\n    note: Explicit human Functional Slice Ready approval recorded for customer-claim-tracking/web after exact-head 9/9 workflow success; lifecycle is now FUNCTIONAL.\n    evidence_ids: [EVD-FUNCTIONAL-TRACKING-WEB-001, EVD-FUNCTIONAL-TRACKING-WEB-APPROVAL-001]\nblockers: []",
            'scoped tracking functional gate',
          );

          replaceOnce(
            "  - id: EVD-FUNCTIONAL-TRACKING-WEB-001\n    type: functional_slice_evidence\n    value: documentation/functional-slices/CUSTOMER_CLAIM_TRACKING_WEB_EVIDENCE.md",
            "  - id: EVD-FUNCTIONAL-TRACKING-WEB-001\n    type: functional_slice_evidence\n    value: documentation/functional-slices/CUSTOMER_CLAIM_TRACKING_WEB_EVIDENCE.md\n  - id: EVD-FUNCTIONAL-TRACKING-WEB-APPROVAL-001\n    type: manual_approval\n    value: documentation/functional-slices/CUSTOMER_CLAIM_TRACKING_WEB_APPROVAL.md",
            'tracking approval artifact',
          );

          fs.writeFileSync(file, text);
          NODE

          grep -q "progress: 67" .blueprint/status.yaml
          grep -q "scope_id: customer-claim-tracking" .blueprint/status.yaml
          grep -q "status: PASS" .blueprint/status.yaml
          grep -q "EVD-FUNCTIONAL-TRACKING-WEB-APPROVAL-001" .blueprint/status.yaml
          git diff --check
          git diff -- .blueprint/status.yaml
      - name: Commit reconciled approval state
        run: |
          git config user.name "MSc Luis A. Hernández Elias"
          git config user.email "88979457+LuisHdezE@users.noreply.github.com"
          git add .blueprint/status.yaml
          git commit -m "chore(blueprint): record tracking functional slice approval"
          git push origin HEAD:blueprint/functional-slice-customer-claim-tracking-web
