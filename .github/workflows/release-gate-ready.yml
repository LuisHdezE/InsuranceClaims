name: Release Gate Ready State

on:
  push:
    branches:
      - blueprint/release-gate
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate Release Gate state and scope
        run: node scripts/validate-release-gate-ready.mjs
