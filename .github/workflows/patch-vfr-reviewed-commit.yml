name: Patch VFR Reviewed Commit Binding

on:
  push:
    branches:
      - blueprint/visual-functional-review-web
    paths:
      - .github/workflows/patch-vfr-reviewed-commit.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: blueprint/visual-functional-review-web
          fetch-depth: 0

      - name: Bind evidence to actual checkout commit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          harness = Path('qa/visual-functional-review-browser.py')
          text = harness.read_text(encoding='utf-8')
          old = '"reviewed_commit": os.environ.get("GITHUB_SHA"),'
          new = '"reviewed_commit": os.environ.get("REVIEWED_COMMIT") or os.environ.get("GITHUB_SHA"),'
          if old not in text:
              raise SystemExit('harness reviewed_commit anchor not found')
          harness.write_text(text.replace(old, new, 1), encoding='utf-8')

          workflow = Path('.github/workflows/visual-functional-review-evidence.yml')
          wf = workflow.read_text(encoding='utf-8')
          anchor = '''      - uses: actions/checkout@v7\n        with:\n          ref: blueprint/visual-functional-review-web\n          fetch-depth: 0\n'''
          replacement = anchor + '''      - name: Bind reviewed commit to actual checkout\n        shell: bash\n        run: echo "REVIEWED_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"\n'''
          if anchor not in wf:
              raise SystemExit('workflow checkout anchor not found')
          workflow.write_text(wf.replace(anchor, replacement, 1), encoding='utf-8')
          PY

      - name: Remove one-time patch workflow
        run: rm -f .github/workflows/patch-vfr-reviewed-commit.yml

      - name: Commit binding correction
        shell: bash
        run: |
          git config user.name 'MSc Luis A. Hernández Elias'
          git config user.email '88979457+LuisHdezE@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'test(ui): bind visual review evidence to tested commit'
          git push origin HEAD:blueprint/visual-functional-review-web
