name: Reconcile Web Lockfile

on:
  push:
    branches: [blueprint/functional-slice-digital-claim-intake-web]
    paths:
      - .github/workflows/web-lockfile-reconcile.yml

permissions:
  contents: write

jobs:
  reconcile:
    if: github.ref_name == 'blueprint/functional-slice-digital-claim-intake-web'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: blueprint/functional-slice-digital-claim-intake-web
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Reconcile workspace lockfile only
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify security-updated direct dependencies
        run: |
          node <<'NODE'
          const p = require('./package-lock.json');
          const web = p.packages['apps/web'].dependencies;
          if (web.axios !== '1.20.0') throw new Error(`Expected axios 1.20.0, got ${web.axios}`);
          if (web['react-router-dom'] !== '7.18.3') throw new Error(`Expected react-router-dom 7.18.3, got ${web['react-router-dom']}`);
          if (web.react !== '19.2.8' || web['react-dom'] !== '19.2.8') throw new Error('React runtime baseline drift');
          if (web.zod !== '4.5.4') throw new Error('Zod baseline drift');
          NODE
          git diff -- package-lock.json
      - name: Commit reconciled lockfile
        run: |
          git config user.name "MSc Luis A. Hernández Elias"
          git config user.email "88979457+LuisHdezE@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo 'Lockfile already reconciled.'
          else
            git commit -m "chore(web): lock security-updated client dependencies"
            git push origin HEAD:blueprint/functional-slice-digital-claim-intake-web
          fi
