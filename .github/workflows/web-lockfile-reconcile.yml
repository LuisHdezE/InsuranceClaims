name: Reconcile Web Lockfile

on:
  push:
    branches: [blueprint/functional-slice-digital-claim-intake-web]
    paths:
      - .github/workflows/web-lockfile-reconcile.yml

permissions:
  contents: write

jobs:
  reconcile:
    if: github.ref_name == 'blueprint/functional-slice-digital-claim-intake-web'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: blueprint/functional-slice-digital-claim-intake-web
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Reconcile workspace lockfile only
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify Zod baseline and web workspace lock
        run: |
          node -e "const p=require('./package-lock.json'); if(p.packages['apps/web'].dependencies.zod !== '4.5.4') process.exit(1)"
          git diff -- package-lock.json
      - name: Commit lockfile if changed
        run: |
          git config user.name "MSc Luis A. Hernández Elias"
          git config user.email "88979457+LuisHdezE@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo 'Lockfile already reconciled.'
          else
            git commit -m "chore(web): align locked Zod baseline"
            git push origin HEAD:blueprint/functional-slice-digital-claim-intake-web
          fi
