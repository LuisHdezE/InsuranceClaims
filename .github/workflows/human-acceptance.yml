name: Human Acceptance State

on:
  pull_request:
    branches:
      - main
    paths:
      - '.blueprint/functional-slices/**'
      - '.blueprint/status.yaml'
      - 'documentation/human-acceptance/**'
      - 'scripts/validate-human-acceptance.mjs'
      - 'scripts/validate-functional-slice-*.mjs'
      - 'scripts/validate-integration-qa-ready.mjs'
      - 'qa/validate-visual-functional-review-ready.py'
      - '.github/workflows/human-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Validate accepted slice lifecycle and evidence
        run: node scripts/validate-human-acceptance.mjs
