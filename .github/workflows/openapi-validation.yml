name: OpenAPI Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Verify deterministic OpenAPI R3 materialization
        run: npm run openapi:check:r3

      - name: Validate OpenAPI 3.1 structure
        run: npx --yes @redocly/cli@2.51.2 lint --extends=spec openapi.yaml

      - name: Bundle and dereference OpenAPI R3
        run: |
          mkdir -p .runtime
          npx --yes @redocly/cli@2.51.2 bundle openapi.yaml --dereferenced --output .runtime/openapi.bundle.json

      - name: Validate frozen R3 contract coverage
        run: npm run openapi:validate:r3

      - name: Assert tracked contract remains unchanged
        run: git diff --exit-code -- openapi.yaml openapi/r3

      - name: Upload validated R3 contract
        uses: actions/upload-artifact@v4
        with:
          name: openapi-r3-validated
          path: |
            openapi.yaml
            openapi/r3/*.json
          if-no-files-found: error
          retention-days: 7
