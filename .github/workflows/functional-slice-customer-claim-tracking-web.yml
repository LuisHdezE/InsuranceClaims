name: Functional Slice - Customer Claim Tracking Web

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  web-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Validate functional slice contract
        run: node scripts/validate-functional-slice-customer-claim-tracking.mjs
      - name: Typecheck web client
        run: npm run typecheck --workspace=@insurance/web
      - name: Web tests
        run: npm run test --workspace=@insurance/web
      - name: Build web client
        run: npm run build --workspace=@insurance/web

  real-api-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: insuranceclaims_tracking_qa
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d insuranceclaims_tracking_qa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/insuranceclaims_tracking_qa
      LEGACY_SIMULATOR_URL: http://127.0.0.1:3200
      LEGACY_SIMULATOR_PORT: '3200'
      PORT: '3000'
      QA_BASE_URL: http://127.0.0.1:3000
      EVIDENCE_STORAGE_DIR: .runtime/evidence-tracking
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Emit Prisma 8 contract
        run: npm run contract:emit
      - name: Prepare synthetic runtime secret
        shell: bash
        run: echo "JWT_SECRET=tracking-qa-jwt-$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Ensure PostgreSQL client
        shell: bash
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
      - name: Bootstrap ephemeral PostgreSQL schema
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f qa/bootstrap.sql
      - name: Start simulated legacy system and API
        shell: bash
        run: |
          mkdir -p .runtime/evidence-tracking
          npm run start:legacy > .runtime/tracking-legacy.log 2>&1 &
          echo $! > .runtime/tracking-legacy.pid
          npm run start:api > .runtime/tracking-api.log 2>&1 &
          echo $! > .runtime/tracking-api.pid
      - name: Wait for runtime services
        shell: bash
        run: |
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3000/health/live >/dev/null 2>&1; then break; fi
            if [[ "$attempt" == "40" ]]; then
              cat .runtime/tracking-api.log || true
              cat .runtime/tracking-legacy.log || true
              exit 1
            fi
            sleep 1
          done
      - name: Exercise tracking web client against real API
        run: npx tsx qa/web-customer-claim-tracking-runtime.ts
      - name: Runtime logs on failure
        if: failure()
        shell: bash
        run: |
          echo '=== API LOG ==='
          tail -n 200 .runtime/tracking-api.log 2>/dev/null || true
          echo '=== LEGACY LOG ==='
          tail -n 200 .runtime/tracking-legacy.log 2>/dev/null || true
      - name: Stop runtime services
        if: always()
        shell: bash
        run: |
          [[ -f .runtime/tracking-api.pid ]] && kill "$(cat .runtime/tracking-api.pid)" 2>/dev/null || true
          [[ -f .runtime/tracking-legacy.pid ]] && kill "$(cat .runtime/tracking-legacy.pid)" 2>/dev/null || true
