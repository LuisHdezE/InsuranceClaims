name: Patch VFR Casefold And Cleanup

on:
  push:
    branches:
      - blueprint/visual-functional-review-web
    paths:
      - .github/workflows/patch-vfr-casefold-cleanup.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: blueprint/visual-functional-review-web
          fetch-depth: 0

      - name: Make rendered-text waits casing-safe
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('qa/visual-functional-review-browser.py')
          text = path.read_text(encoding='utf-8')
          old = 'wait.until(lambda d: text in d.find_element(By.TAG_NAME, "body").text)'
          new = 'wait.until(lambda d: text.casefold() in d.find_element(By.TAG_NAME, "body").text.casefold())'
          if old not in text:
              raise SystemExit('expected wait_text anchor not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Remove one-time patch workflows
        shell: bash
        run: |
          rm -f \
            .github/workflows/patch-vfr-browser-click.yml \
            .github/workflows/patch-vfr-datetime.yml \
            .github/workflows/patch-vfr-diagnostics.yml \
            .github/workflows/patch-vfr-casefold-cleanup.yml

      - name: Commit review harness correction and cleanup
        shell: bash
        run: |
          git config user.name 'MSc Luis A. Hernández Elias'
          git config user.email '88979457+LuisHdezE@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'test(ui): make visual review waits casing-safe and clean patchers'
          git push origin HEAD:blueprint/visual-functional-review-web
