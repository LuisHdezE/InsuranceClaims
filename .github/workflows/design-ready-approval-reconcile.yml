name: Reconcile Design Ready Approval

on:
  push:
    branches: [blueprint/design-system]
    paths:
      - .github/workflows/design-ready-approval-reconcile.yml

permissions:
  contents: write

jobs:
  reconcile:
    if: github.ref_name == 'blueprint/design-system'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: blueprint/design-system
          fetch-depth: 0
      - name: Reconcile only Design System approval status
        shell: python
        run: |
          from pathlib import Path
          import os, re

          path = Path('.blueprint/status.yaml')
          text = path.read_text()
          original = text

          timestamp = os.popen("TZ=America/Montevideo date --iso-8601=seconds").read().strip()
          text, n = re.subn(r"updated_at: '[^']+'", f"updated_at: '{timestamp}'", text, count=1)
          assert n == 1

          old_phase = """  design_system:\n    status: READY_FOR_REVIEW\n    progress: 100\n    note: FAR-aligned public/customer and operational backoffice Design System, tokens, accessibility, responsive behavior and semantic states are validated; explicit human Design System Ready approval remains pending.\n"""
          new_phase = """  design_system:\n    status: COMPLETE\n    progress: 100\n    note: FAR-aligned public/customer and operational backoffice Design System was explicitly approved by Luis Hernández after exact-head validation of identity, logo, tokens, accessibility, responsive behavior and semantic states.\n"""
          assert old_phase in text, 'expected Design System READY_FOR_REVIEW phase block not found'
          text = text.replace(old_phase, new_phase, 1)

          old_gate = """  design_system_ready:\n    status: READY_FOR_REVIEW\n    note: All five required Design System checks pass and applicable FAR Visual Identity/Logo checks also pass; exact-head human approval remains pending.\n    evidence_ids: [EVD-DESIGN-SYSTEM-001, EVD-DESIGN-TOKENS-001, EVD-DESIGN-SYSTEM-EVIDENCE-001, EVD-DESIGN-SYSTEM-VALIDATION-001, EVD-DESIGN-LOGO-001, EVD-DESIGN-LANDING-REFERENCE-001]\n"""
          new_gate = f"""  design_system_ready:\n    status: PASS\n    evaluated_at: '{timestamp}'\n    note: Explicit human Design System Ready approval recorded after revised FAR identity/logo validation and exact-head success of Design System, Interface Inventory and full API regressions.\n    evidence_ids: [EVD-DESIGN-SYSTEM-001, EVD-DESIGN-TOKENS-001, EVD-DESIGN-SYSTEM-EVIDENCE-001, EVD-DESIGN-SYSTEM-VALIDATION-001, EVD-DESIGN-LOGO-001, EVD-DESIGN-LANDING-REFERENCE-001, EVD-DESIGN-SYSTEM-READY-APPROVAL-001]\n"""
          assert old_gate in text, 'expected Design System Ready gate block not found'
          text = text.replace(old_gate, new_gate, 1)

          anchor = """  - id: EVD-DESIGN-LANDING-REFERENCE-001\n    type: approved_visual_reference\n    value: .blueprint/ui/references/far-public-landing-approved.md\n"""
          addition = anchor + """  - id: EVD-DESIGN-SYSTEM-READY-APPROVAL-001\n    type: manual_approval\n    value: documentation/design-system/DESIGN_SYSTEM_READY_APPROVAL.md\n"""
          assert anchor in text, 'expected landing reference artifact anchor not found'
          assert 'EVD-DESIGN-SYSTEM-READY-APPROVAL-001' not in original, 'approval evidence already existed unexpectedly'
          text = text.replace(anchor, addition, 1)

          assert text != original
          path.write_text(text)
      - name: Verify scope of status change
        run: |
          git diff -- .blueprint/status.yaml
          git diff -- .blueprint/status.yaml | grep -q 'design_system:'
          git diff -- .blueprint/status.yaml | grep -q 'design_system_ready:'
          git diff -- .blueprint/status.yaml | grep -q 'EVD-DESIGN-SYSTEM-READY-APPROVAL-001'
      - name: Commit approved Design System status
        run: |
          git config user.name "MSc Luis A. Hernández Elias"
          git config user.email "88979457+LuisHdezE@users.noreply.github.com"
          git add .blueprint/status.yaml
          git commit -m "chore: mark Design System Ready approved"
          git push origin HEAD:blueprint/design-system
