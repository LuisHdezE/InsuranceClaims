name: Release Gate Evidence

on:
  push:
    branches:
      - blueprint/release-gate
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-gate-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Emit Prisma 8 contract
        run: npm run contract:emit
      - name: Validate Release Gate evidence prerequisites
        run: node scripts/validate-release-evidence.mjs
      - name: Typecheck backend and web
        run: npm run typecheck
      - name: Run backend tests
        run: npm test
      - name: Verify architecture boundaries
        run: npm run architecture:check
      - name: Run web tests
        run: npm --workspace @insurance/web test
      - name: Build web release candidate
        run: npm --workspace @insurance/web run build
      - name: Reject high or critical production dependency advisories
        shell: bash
        run: |
          mkdir -p .runtime
          npm audit --omit=dev --json > .runtime/npm-audit-production.json || true
          node scripts/classify-production-audit.mjs \
            .runtime/npm-audit-production.json \
            .runtime/npm-audit-production-summary.json \
            release.security_accepted
      - name: Ensure PostgreSQL client tools
        shell: bash
        run: |
          missing=0
          for tool in psql createdb dropdb; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              missing=1
            fi
          done
          if [[ "$missing" == "1" ]]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
          psql --version
          createdb --version
          dropdb --version
      - name: Prove PostgreSQL backup and restore
        run: bash qa/release-backup-restore.sh
      - name: Upload Release Gate security evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-security-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            .runtime/npm-audit-production.json
            .runtime/npm-audit-production-summary.json
          if-no-files-found: error
          retention-days: 30
      - name: Release Gate machine candidate summary
        shell: bash
        run: |
          candidate_sha=$(git rev-parse HEAD)
          echo "RELEASE_GATE_EVIDENCE_PASS"
          echo "candidate_sha=$candidate_sha"
          echo "release.functional_slices_accepted=PASS"
          echo "release.security_accepted=PASS"
          echo "release.documentation=PASS"
          echo "release.backup_restore=PASS"
          echo "release_gate=READY_FOR_REVIEW_PENDING_HUMAN_DECISION"
