name: Integration QA - Web Slices

on:
  push:
    branches: [blueprint/integration-qa-web]
    paths:
      - apps/web/**
      - apps/api/**
      - apps/legacy-simulator/**
      - packages/**
      - qa/**
      - openapi.yaml
      - .blueprint/functional-slices/**
      - .blueprint/status.yaml
      - documentation/integration-qa/**
      - .github/workflows/integration-qa-web.yml
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  system-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: insuranceclaims_integration_qa
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d insuranceclaims_integration_qa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/insuranceclaims_integration_qa
      LEGACY_SIMULATOR_URL: http://127.0.0.1:3200
      LEGACY_SIMULATOR_PORT: '3200'
      PORT: '3000'
      QA_BASE_URL: http://127.0.0.1:3000
      QA_WEB_BASE_URL: http://127.0.0.1:5173
      QA_OPERATOR_LOGIN: qa.operator@example.invalid
      EVIDENCE_STORAGE_DIR: .runtime/evidence-integration-qa

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install locked dependencies
        run: npm ci

      - name: Emit Prisma 8 contract
        run: npm run contract:emit

      - name: Typecheck backend and web
        shell: bash
        run: |
          npm run typecheck
          npm run typecheck --workspace=@insurance/web

      - name: Run backend and web tests
        shell: bash
        run: |
          npm test
          npm test --workspace=@insurance/web

      - name: Verify architecture and production builds
        shell: bash
        run: |
          npm run architecture:check
          npm run build
          npm run build --workspace=@insurance/web

      - name: Prepare synthetic QA secrets
        shell: bash
        run: |
          echo "JWT_SECRET=integration-qa-jwt-$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "QA_OPERATOR_PASSWORD=Integration-qa-$(openssl rand -hex 16)!" >> "$GITHUB_ENV"

      - name: Ensure PostgreSQL client and browser runtime
        shell: bash
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          python -m pip install --disable-pip-version-check selenium==4.35.0
          browser_bin="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [[ -z "$browser_bin" ]]; then
            echo "No supported Chrome/Chromium binary found on runner" >&2
            exit 1
          fi
          echo "BROWSER_BIN=$browser_bin" >> "$GITHUB_ENV"
          psql --version
          "$browser_bin" --version

      - name: Bootstrap ephemeral PostgreSQL schema and seed operator
        shell: bash
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f qa/bootstrap.sql
          npx tsx qa/seed.ts

      - name: Start simulated legacy, API and web client
        shell: bash
        run: |
          mkdir -p .runtime/evidence-integration-qa
          npm run start:legacy > .runtime/integration-legacy.log 2>&1 &
          echo $! > .runtime/integration-legacy.pid
          npm run start:api > .runtime/integration-api.log 2>&1 &
          echo $! > .runtime/integration-api.pid
          npm run dev --workspace=@insurance/web -- --host 127.0.0.1 > .runtime/integration-web.log 2>&1 &
          echo $! > .runtime/integration-web.pid

      - name: Wait for runtime services
        shell: bash
        run: |
          for attempt in $(seq 1 50); do
            legacy_ok=0
            api_ok=0
            web_ok=0
            curl -fsS -X POST -H 'content-type: application/json' \
              -d '{"policy_no":"SYN-POL-001","vehicle_ref":"SYN-VEH-001"}' \
              http://127.0.0.1:3200/legacy/v1/policy-vehicle/verify >/dev/null 2>&1 && legacy_ok=1 || true
            curl -fsS http://127.0.0.1:3000/health/live >/dev/null 2>&1 && api_ok=1 || true
            curl -fsS http://127.0.0.1:5173/ >/dev/null 2>&1 && web_ok=1 || true
            if [[ "$legacy_ok" == "1" && "$api_ok" == "1" && "$web_ok" == "1" ]]; then exit 0; fi
            if [[ "$attempt" == "50" ]]; then
              cat .runtime/integration-legacy.log || true
              cat .runtime/integration-api.log || true
              cat .runtime/integration-web.log || true
              exit 1
            fi
            sleep 1
          done

      - name: Run cross-cutting API security contract concurrency and rate-limit QA
        run: node qa/runtime-qa.mjs

      - name: Verify durable audit and persistence invariants
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f qa/audit-assertions.sql

      - name: Classify production dependency vulnerabilities
        shell: bash
        run: |
          npm audit --omit=dev --json > .runtime/npm-audit-production.json || true
          node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('.runtime/npm-audit-production.json', 'utf8'));
          const counts = report.metadata?.vulnerabilities ?? {};
          const high = counts.high ?? 0;
          const critical = counts.critical ?? 0;
          console.log(JSON.stringify({ event: 'INTEGRATION_PRODUCTION_DEPENDENCY_AUDIT', high, critical, total: counts.total ?? 0 }));
          if (high > 0 || critical > 0) process.exit(1);
          NODE

      - name: Restart API to reset transport rate-limit state
        shell: bash
        run: |
          # npm is only a wrapper; terminate the actual tsx API child so its in-memory
          # limiter cannot survive into the client-integration half of this workflow.
          pkill -f 'tsx apps/api/src/main.ts' 2>/dev/null || true
          [[ -f .runtime/integration-api.pid ]] && kill "$(cat .runtime/integration-api.pid)" 2>/dev/null || true
          for attempt in $(seq 1 20); do
            if ! curl -fsS http://127.0.0.1:3000/health/live >/dev/null 2>&1; then break; fi
            if [[ "$attempt" == "20" ]]; then
              echo 'Previous API process did not stop cleanly' >&2
              ps -ef | grep -E 'tsx apps/api/src/main.ts|start:api' | grep -v grep || true
              exit 1
            fi
            sleep 0.25
          done
          : > .runtime/integration-api.log
          npm run start:api > .runtime/integration-api.log 2>&1 &
          echo $! > .runtime/integration-api.pid
          for attempt in $(seq 1 40); do
            curl -fsS http://127.0.0.1:3000/health/live >/dev/null 2>&1 && exit 0
            if [[ "$attempt" == "40" ]]; then cat .runtime/integration-api.log || true; exit 1; fi
            sleep 1
          done

      - name: Exercise each web API client against real dependencies
        shell: bash
        run: |
          npx tsx qa/web-digital-claim-intake-runtime.ts
          npx tsx qa/web-customer-claim-tracking-runtime.ts
          npx tsx qa/web-claims-backoffice-runtime.ts

      - name: Exercise cross-interface browser journey responsive and accessibility
        shell: bash
        run: GITHUB_SHA="$(git rev-parse HEAD)" python qa/visual-functional-review-browser.py

      - name: Exercise browser offline and degraded behavior for all slices
        shell: bash
        run: GITHUB_SHA="$(git rev-parse HEAD)" python qa/integration-offline-browser.py

      - name: Validate scoped Integration QA evidence
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          offline = json.loads(Path('.runtime/integration-offline-browser.json').read_text(encoding='utf-8'))
          browser = json.loads(Path('documentation/visual-functional-review/generated/visual-functional-review-browser.json').read_text(encoding='utf-8'))
          expected = {
              'digital-claim-intake/web',
              'customer-claim-tracking/web',
              'claims-backoffice/web',
          }
          assert set(offline['slices']) == expected
          assert set(browser['slices']) == expected
          assert browser['summary']['machine_review_ready'] is True
          for slice_id in expected:
              assert offline['slices'][slice_id]['qa.offline'] == 'PASS'
              checks = browser['slices'][slice_id]['checks']
              assert checks['review.responsive'] == 'PASS'
              assert checks['review.accessibility'] == 'PASS'
              assert checks['review.api_permission_fidelity'] == 'PASS'
              assert checks['review.business_data_fidelity'] == 'PASS'

          summary = {
              'schema_version': '0.5.0',
              'gate': 'integration_qa_pass',
              'scope': 'interface_slice_platform',
              'platform': 'web',
              'reviewed_commit': browser['reviewed_commit'],
              'slices': {
                  'digital-claim-intake/web': {
                      'qa.functional': 'PASS',
                      'qa.real_api_transport': 'PASS',
                      'qa.integration': 'PASS',
                      'qa.security': 'PASS',
                      'qa.responsive': 'PASS',
                      'qa.accessibility': 'PASS',
                      'qa.e2e': 'PASS',
                      'qa.idempotency': 'PASS',
                      'qa.offline': 'PASS',
                  },
                  'customer-claim-tracking/web': {
                      'qa.functional': 'PASS',
                      'qa.real_api_transport': 'PASS',
                      'qa.integration': 'PASS',
                      'qa.security': 'PASS',
                      'qa.responsive': 'PASS',
                      'qa.accessibility': 'PASS',
                      'qa.e2e': 'PASS',
                      'qa.idempotency': 'N/A',
                      'qa.offline': 'PASS',
                  },
                  'claims-backoffice/web': {
                      'qa.functional': 'PASS',
                      'qa.real_api_transport': 'PASS',
                      'qa.integration': 'PASS',
                      'qa.security': 'PASS',
                      'qa.responsive': 'PASS',
                      'qa.accessibility': 'PASS',
                      'qa.e2e': 'PASS',
                      'qa.idempotency': 'N/A',
                      'qa.offline': 'PASS',
                  },
              },
              'next_status': 'READY_FOR_REVIEW',
              'human_acceptance_started': False,
              'release_gate_started': False,
          }
          Path('.runtime/integration-qa-summary.json').write_text(json.dumps(summary, indent=2) + '\n', encoding='utf-8')
          print(json.dumps({'event': 'INTEGRATION_QA_READY_PASS', 'slices': sorted(expected)}))
          PY

      - name: Upload Integration QA runtime evidence
        uses: actions/upload-artifact@v4
        with:
          name: integration-qa-web-${{ github.sha }}
          path: |
            .runtime/integration-qa-summary.json
            .runtime/integration-offline-browser.json
            .runtime/api-qa-state.json
            .runtime/npm-audit-production.json
            documentation/visual-functional-review/generated/visual-functional-review-browser.json
          if-no-files-found: error
          retention-days: 30

      - name: Runtime logs on failure
        if: failure()
        shell: bash
        run: |
          echo '=== API LOG ==='
          tail -n 250 .runtime/integration-api.log 2>/dev/null || true
          echo '=== LEGACY LOG ==='
          tail -n 250 .runtime/integration-legacy.log 2>/dev/null || true
          echo '=== WEB LOG ==='
          tail -n 250 .runtime/integration-web.log 2>/dev/null || true

      - name: Stop runtime services
        if: always()
        shell: bash
        run: |
          pkill -f 'tsx apps/api/src/main.ts' 2>/dev/null || true
          pkill -f 'tsx apps/legacy-simulator/src/main.ts' 2>/dev/null || true
          pkill -f 'vite --host 127.0.0.1' 2>/dev/null || true
          [[ -f .runtime/integration-web.pid ]] && kill "$(cat .runtime/integration-web.pid)" 2>/dev/null || true
          [[ -f .runtime/integration-api.pid ]] && kill "$(cat .runtime/integration-api.pid)" 2>/dev/null || true
          [[ -f .runtime/integration-legacy.pid ]] && kill "$(cat .runtime/integration-legacy.pid)" 2>/dev/null || true
