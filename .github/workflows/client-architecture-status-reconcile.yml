name: Reconcile Client Architecture Status

on:
  push:
    branches: [blueprint/client-architecture]
    paths:
      - .github/workflows/client-architecture-status-reconcile.yml

permissions:
  contents: write

jobs:
  reconcile:
    if: github.ref_name == 'blueprint/client-architecture'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: blueprint/client-architecture
          fetch-depth: 0
      - name: Reconcile only Client Architecture status
        shell: python
        run: |
          from pathlib import Path
          import os, re

          path = Path('.blueprint/status.yaml')
          text = path.read_text()
          original = text

          timestamp = os.popen("TZ=America/Montevideo date --iso-8601=seconds").read().strip()
          text, n = re.subn(r"updated_at: '[^']+'", f"updated_at: '{timestamp}'", text, count=1)
          assert n == 1

          phase_anchor = """  design_system:\n    status: COMPLETE\n    progress: 100\n    note: FAR-aligned public/customer and operational backoffice Design System was explicitly approved by Luis Hernández after exact-head validation of identity, logo, tokens, accessibility, responsive behavior and semantic states.\n"""
          phase_addition = phase_anchor + """  client_architecture:\n    status: READY_FOR_REVIEW\n    progress: 100\n    note: Reusable web platform baseline and three exact slice/platform bindings are semantically validated; explicit human Client Architecture Ready decisions remain pending.\n"""
          assert phase_anchor in text, 'expected design_system phase anchor not found'
          assert '\n  client_architecture:\n' not in original, 'client_architecture phase already existed unexpectedly'
          text = text.replace(phase_anchor, phase_addition, 1)

          check_anchor = """  design.semantic_states:\n    status: PASS\n    verification: evidence\n    note: Loading, empty, error, offline, forbidden, validation, conflict and rate-limit states plus all normalized inventory states are represented text-first.\n    evidence_ids: [EVD-DESIGN-SYSTEM-001, EVD-DESIGN-SYSTEM-VALIDATION-001]\n"""
          client_checks = check_anchor + """  client.architecture_contract:\n    status: PASS\n    verification: file\n    note: One reusable Greenfield web platform baseline composes with three exact slice bindings into the effective client contracts.\n    evidence_ids: [EVD-CLIENT-PLATFORM-WEB-001, EVD-CLIENT-INTAKE-WEB-001, EVD-CLIENT-TRACKING-WEB-001, EVD-CLIENT-BACKOFFICE-WEB-001, EVD-CLIENT-ARCH-VALIDATION-001]\n  client.visual_contract_binding:\n    status: PASS\n    verification: evidence\n    note: All slices bind to the approved FAR-aligned Design System/tokens; WEB-001 preserves its approved landing reference as a shared visual input without becoming a fourth slice.\n    evidence_ids: [EVD-CLIENT-PLATFORM-WEB-001, EVD-CLIENT-ARCH-EVIDENCE-001, EVD-CLIENT-ARCH-VALIDATION-001, EVD-DESIGN-SYSTEM-001, EVD-DESIGN-LANDING-REFERENCE-001]\n  client.auth_lifecycle:\n    status: PASS\n    verification: evidence\n    note: Operator JWT is memory-only, refresh is disabled/N/A, protected 401 clears auth/cache, and logout remains local because no logout/refresh API exists.\n    evidence_ids: [EVD-CLIENT-PLATFORM-WEB-001, EVD-CLIENT-BACKOFFICE-WEB-001, EVD-CLIENT-ARCH-EVIDENCE-001, EVD-CLIENT-ARCH-VALIDATION-001]\n  client.api_client_strategy:\n    status: PASS\n    verification: evidence\n    note: A centralized Axios REST transport behind TanStack Query is constrained to current OpenAPI, RFC 9457, correlation headers and approved auth/idempotency behavior.\n    evidence_ids: [EVD-CLIENT-PLATFORM-WEB-001, EVD-CLIENT-ARCH-EVIDENCE-001, EVD-CLIENT-ARCH-VALIDATION-001]\n  client.api_contract_binding:\n    status: PASS\n    verification: evidence\n    note: All three bindings identify api-v1-r1 and exactly reconcile operationIds against executable inventory and current OpenAPI.\n    evidence_ids: [EVD-CLIENT-INTAKE-WEB-001, EVD-CLIENT-TRACKING-WEB-001, EVD-CLIENT-BACKOFFICE-WEB-001, EVD-CLIENT-ARCH-VALIDATION-001]\n  client.authorization_presentation:\n    status: PASS\n    verification: evidence\n    note: Permission-aware presentation improves UX but every binding preserves API/Application authorization as authoritative.\n    evidence_ids: [EVD-CLIENT-PLATFORM-WEB-001, EVD-CLIENT-INTAKE-WEB-001, EVD-CLIENT-TRACKING-WEB-001, EVD-CLIENT-BACKOFFICE-WEB-001, EVD-CLIENT-ARCH-VALIDATION-001]\n  client.routing_navigation:\n    status: PASS\n    verification: evidence\n    note: The three slice route sets exactly match their executable inventory; WEB-001 remains the shared public entry outside scoped slice bindings.\n    evidence_ids: [EVD-CLIENT-INTAKE-WEB-001, EVD-CLIENT-TRACKING-WEB-001, EVD-CLIENT-BACKOFFICE-WEB-001, EVD-CLIENT-ARCH-VALIDATION-001]\n  client.state_cache_strategy:\n    status: PASS\n    verification: evidence\n    note: TanStack Query owns server state, React owns ephemeral UI state, protected cache clears on auth loss, and transition success/conflict has explicit invalidation/refetch behavior.\n    evidence_ids: [EVD-CLIENT-PLATFORM-WEB-001, EVD-CLIENT-ARCH-EVIDENCE-001, EVD-CLIENT-ARCH-VALIDATION-001]\n  client.forms_validation:\n    status: PASS\n    verification: evidence\n    note: React Hook Form plus Zod provides structural feedback only; policy eligibility, evidence acceptance, lifecycle and authorization remain server-authoritative.\n    evidence_ids: [EVD-CLIENT-PLATFORM-WEB-001, EVD-CLIENT-INTAKE-WEB-001, EVD-CLIENT-BACKOFFICE-WEB-001, EVD-CLIENT-ARCH-VALIDATION-001]\n  client.async_error_offline:\n    status: PASS\n    verification: evidence\n    note: Required async/error states are slice-bound and degraded offline queues no business writes or durable authoritative browser state.\n    evidence_ids: [EVD-CLIENT-PLATFORM-WEB-001, EVD-CLIENT-INTAKE-WEB-001, EVD-CLIENT-TRACKING-WEB-001, EVD-CLIENT-BACKOFFICE-WEB-001, EVD-CLIENT-ARCH-VALIDATION-001]\n  client.idempotency_strategy:\n    status: PASS\n    verification: evidence\n    note: createClaim is the only Idempotency-Key client mutation; transitionClaimStatus retains expectedFromStatus concurrency without an invented idempotency protocol.\n    evidence_ids: [EVD-CLIENT-INTAKE-WEB-001, EVD-CLIENT-BACKOFFICE-WEB-001, EVD-CLIENT-ARCH-EVIDENCE-001, EVD-CLIENT-ARCH-VALIDATION-001]\n  client.observability_correlation:\n    status: PASS\n    verification: evidence\n    note: X-Request-Id/requestId correlates sanitized client diagnostics while credentials, tracking proofs, evidence and payloads remain redacted.\n    evidence_ids: [EVD-CLIENT-PLATFORM-WEB-001, EVD-CLIENT-ARCH-EVIDENCE-001, EVD-CLIENT-ARCH-VALIDATION-001]\n  client.accessibility:\n    status: PASS\n    verification: evidence\n    note: WCAG 2.2 AA, keyboard semantics, focus management, live regions and minimum 44px touch targets are mandatory across public and backoffice clients.\n    evidence_ids: [EVD-CLIENT-PLATFORM-WEB-001, EVD-CLIENT-ARCH-EVIDENCE-001, EVD-CLIENT-ARCH-VALIDATION-001]\n  client.testing_strategy:\n    status: PASS\n    verification: evidence\n    note: Unit, component/UI, integration and real-API E2E layers are all mandatory before slice acceptance.\n    evidence_ids: [EVD-CLIENT-PLATFORM-WEB-001, EVD-CLIENT-ARCH-EVIDENCE-001, EVD-CLIENT-ARCH-VALIDATION-001]\n  client.platform_contract:\n    status: PASS\n    verification: evidence\n    note: The web platform contract fixes React SPA, React Router, TanStack Query, React Hook Form, Vite, Tailwind-aligned Design System use and the approved browser support boundary.\n    evidence_ids: [EVD-CLIENT-PLATFORM-WEB-001, EVD-CLIENT-ARCH-EVIDENCE-001, EVD-CLIENT-ARCH-VALIDATION-001]\n  client.brownfield_coexistence:\n    status: N/A\n    verification: evidence\n    note: Project delivery mode is GREENFIELD; the SIMULATED LEGACY SYSTEM is a server-side Infrastructure dependency, not an existing client coexistence/cutover surface.\n    evidence_ids: [EVD-CLIENT-ARCH-EVIDENCE-001, EVD-CLIENT-ARCH-VALIDATION-001]\n"""
          assert check_anchor in text, 'expected Design System check anchor not found'
          assert '  client.architecture_contract:\n' not in original, 'Client Architecture checks already existed unexpectedly'
          text = text.replace(check_anchor, client_checks, 1)

          scoped_anchor = "scoped_gates: []\n"
          scoped_value = """scoped_gates:\n  - gate: client_architecture_ready\n    scope: interface_slice_platform\n    scope_id: digital-claim-intake\n    platform: web\n    status: READY_FOR_REVIEW\n    note: Platform baseline plus digital-claim-intake/web binding passes semantic validation; explicit human scoped approval remains pending.\n    evidence_ids: [EVD-CLIENT-PLATFORM-WEB-001, EVD-CLIENT-INTAKE-WEB-001, EVD-CLIENT-ARCH-EVIDENCE-001, EVD-CLIENT-ARCH-VALIDATION-001]\n  - gate: client_architecture_ready\n    scope: interface_slice_platform\n    scope_id: customer-claim-tracking\n    platform: web\n    status: READY_FOR_REVIEW\n    note: Platform baseline plus customer-claim-tracking/web binding passes semantic validation; explicit human scoped approval remains pending.\n    evidence_ids: [EVD-CLIENT-PLATFORM-WEB-001, EVD-CLIENT-TRACKING-WEB-001, EVD-CLIENT-ARCH-EVIDENCE-001, EVD-CLIENT-ARCH-VALIDATION-001]\n  - gate: client_architecture_ready\n    scope: interface_slice_platform\n    scope_id: claims-backoffice\n    platform: web\n    status: READY_FOR_REVIEW\n    note: Platform baseline plus claims-backoffice/web binding passes semantic validation; explicit human scoped approval remains pending.\n    evidence_ids: [EVD-CLIENT-PLATFORM-WEB-001, EVD-CLIENT-BACKOFFICE-WEB-001, EVD-CLIENT-ARCH-EVIDENCE-001, EVD-CLIENT-ARCH-VALIDATION-001]\n"""
          assert scoped_anchor in text, 'expected empty scoped_gates anchor not found'
          text = text.replace(scoped_anchor, scoped_value, 1)

          artifact_anchor = """  - id: EVD-DESIGN-SYSTEM-READY-APPROVAL-001\n    type: manual_approval\n    value: documentation/design-system/DESIGN_SYSTEM_READY_APPROVAL.md\n"""
          artifact_addition = artifact_anchor + """  - id: EVD-CLIENT-PLATFORM-WEB-001\n    type: client_platform_architecture\n    value: .blueprint/client-architecture/web-platform.json\n  - id: EVD-CLIENT-INTAKE-WEB-001\n    type: client_slice_architecture\n    value: .blueprint/client-architecture/digital-claim-intake.web.json\n  - id: EVD-CLIENT-TRACKING-WEB-001\n    type: client_slice_architecture\n    value: .blueprint/client-architecture/customer-claim-tracking.web.json\n  - id: EVD-CLIENT-BACKOFFICE-WEB-001\n    type: client_slice_architecture\n    value: .blueprint/client-architecture/claims-backoffice.web.json\n  - id: EVD-CLIENT-ARCH-EVIDENCE-001\n    type: client_architecture_evidence\n    value: documentation/client-architecture/CLIENT_ARCHITECTURE.md\n  - id: EVD-CLIENT-ARCH-VALIDATION-001\n    type: client_architecture_validation_evidence\n    value: documentation/client-architecture/CLIENT_ARCHITECTURE_VALIDATION_EVIDENCE.md\n"""
          assert artifact_anchor in text, 'expected Design System approval artifact anchor not found'
          assert 'EVD-CLIENT-PLATFORM-WEB-001' not in original, 'Client Architecture evidence already existed unexpectedly'
          text = text.replace(artifact_anchor, artifact_addition, 1)

          assert text != original
          path.write_text(text)
      - name: Verify scoped status change only
        run: |
          git diff -- .blueprint/status.yaml
          git diff -- .blueprint/status.yaml | grep -q 'client_architecture:'
          git diff -- .blueprint/status.yaml | grep -q 'client.architecture_contract:'
          git diff -- .blueprint/status.yaml | grep -q 'scope_id: digital-claim-intake'
          git diff -- .blueprint/status.yaml | grep -q 'scope_id: customer-claim-tracking'
          git diff -- .blueprint/status.yaml | grep -q 'scope_id: claims-backoffice'
      - name: Commit reconciled Client Architecture status
        run: |
          git config user.name "MSc Luis A. Hernández Elias"
          git config user.email "88979457+LuisHdezE@users.noreply.github.com"
          git add .blueprint/status.yaml
          git commit -m "chore: reconcile scoped Client Architecture status"
          git push origin HEAD:blueprint/client-architecture
