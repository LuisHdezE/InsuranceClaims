name: Patch VFR Datetime Input

on:
  push:
    branches: [blueprint/visual-functional-review-web]
    paths:
      - .github/workflows/patch-vfr-datetime.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: blueprint/visual-functional-review-web
          fetch-depth: 0
      - name: Set datetime-local through native browser value contract
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('qa/visual-functional-review-browser.py')
          text = path.read_text(encoding='utf-8')
          old = '''def set_input(element_id: str, value: str) -> None:
              element = wait.until(EC.visibility_of_element_located((By.ID, element_id)))
              element.clear()
              element.send_keys(value)
          '''
          new = '''def set_input(element_id: str, value: str) -> None:
              element = wait.until(EC.visibility_of_element_located((By.ID, element_id)))
              if element.get_attribute("type") == "datetime-local":
                  driver.execute_script(
                      """
                      const el = arguments[0];
                      const value = arguments[1];
                      const setter = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value').set;
                      setter.call(el, value);
                      el.dispatchEvent(new Event('input', { bubbles: true }));
                      el.dispatchEvent(new Event('change', { bubbles: true }));
                      """,
                      element,
                      value,
                  )
                  return
              element.clear()
              element.send_keys(value)
          '''
          if old not in text:
              raise SystemExit('Expected set_input anchor not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          git diff -- qa/visual-functional-review-browser.py
      - name: Commit harness correction
        run: |
          git config user.name "MSc Luis A. Hernández Elias"
          git config user.email "88979457+LuisHdezE@users.noreply.github.com"
          git add qa/visual-functional-review-browser.py
          git commit -m "test(ui): set datetime through native browser events"
          git push origin HEAD:blueprint/visual-functional-review-web
