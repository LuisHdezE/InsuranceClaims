name: R3 Task 12 Full-System Visual V6

on:
  push:
    branches: [review/r3-task12-full-system-visual-v6]

permissions:
  contents: read

jobs:
  exact-head-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: insuranceclaims_r3_task12_visual_v6
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d insuranceclaims_r3_task12_visual_v6"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      REVIEW_TARGET_SHA: 24817b7d36a23cc184a0615da9fb8a4e251ab2e2
      REVIEW_DIR: .runtime/r3-task12-visual-v6
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/insuranceclaims_r3_task12_visual_v6
      LEGACY_SIMULATOR_URL: http://127.0.0.1:3200
      LEGACY_SIMULATOR_PORT: '3200'
      PORT: '3000'
      QA_BASE_URL: http://127.0.0.1:3000
      QA_WEB_BASE_URL: http://127.0.0.1:5173
      QA_OPERATOR_LOGIN: qa.operator@example.invalid
      QA_ADMIN_LOGIN: qa.admin@example.invalid
      QA_SUPERVISOR_LOGIN: qa.supervisor@example.invalid
      QA_CUSTOMER_LOGIN: qa.customer@example.invalid
      EVIDENCE_STORAGE_DIR: .runtime/evidence-r3-task12-visual-v6
      IMPORT_SOURCE_STORAGE_DIR: .runtime/imports-r3-task12-visual-v6
      COLLECTION_PAYMENT_STATE_VALUES_JSON: '["DEMO_STATE_A","DEMO_STATE_B"]'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 24817b7d36a23cc184a0615da9fb8a4e251ab2e2
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Verify exact Task 12 product head
        run: test "$(git rev-parse HEAD)" = "$REVIEW_TARGET_SHA"

      - name: Install dependencies and browser harness
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          python -m pip install --disable-pip-version-check selenium==4.35.0
          browser_bin="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$browser_bin"
          echo "BROWSER_BIN=$browser_bin" >> "$GITHUB_ENV"
          echo "JWT_SECRET=r3-task12-v6-$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "CUSTOMER_JWT_SECRET=r3-task12-v6-customer-$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "QA_OPERATOR_PASSWORD=R3-task12-v6-operator-$(openssl rand -hex 16)!" >> "$GITHUB_ENV"
          echo "QA_CUSTOMER_PASSWORD=R3-task12-v6-customer-$(openssl rand -hex 16)!" >> "$GITHUB_ENV"

      - name: Bootstrap exact-head runtime
        shell: bash
        run: |
          set -euo pipefail
          npm run contract:emit
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f qa/bootstrap.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f qa/r3-insurer-guidance.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f prisma/migrations/20260909_09_customer_portal_r3.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f prisma/migrations/20260909_10_governed_imports_r3.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f prisma/migrations/20260909_01_renewals_r3.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f prisma/migrations/20260909_02_collections_r3.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f prisma/migrations/20260909_03_custom_fields_r3.sql
          npx tsx qa/seed.ts
          mkdir -p "$REVIEW_DIR" "$EVIDENCE_STORAGE_DIR" "$IMPORT_SOURCE_STORAGE_DIR"
          npm run start:legacy > "$REVIEW_DIR/legacy.log" 2>&1 & echo $! > "$REVIEW_DIR/legacy.pid"
          npm run start:api > "$REVIEW_DIR/api.log" 2>&1 & echo $! > "$REVIEW_DIR/api.pid"
          npm run dev --workspace=@insurance/web -- --host 127.0.0.1 > "$REVIEW_DIR/web.log" 2>&1 & echo $! > "$REVIEW_DIR/web.pid"
          for attempt in $(seq 1 60); do
            legacy_ok=0; api_ok=0; web_ok=0
            curl -fsS -X POST -H 'content-type: application/json' -d '{"policy_no":"SYN-POL-001","vehicle_ref":"SYN-VEH-001"}' http://127.0.0.1:3200/legacy/v1/policy-vehicle/verify >/dev/null 2>&1 && legacy_ok=1 || true
            curl -fsS http://127.0.0.1:3000/health/live >/dev/null 2>&1 && api_ok=1 || true
            curl -fsS http://127.0.0.1:5173/ >/dev/null 2>&1 && web_ok=1 || true
            if [[ "$legacy_ok" == 1 && "$api_ok" == 1 && "$web_ok" == 1 ]]; then exit 0; fi
            sleep 1
          done
          cat "$REVIEW_DIR/api.log" || true
          exit 1

      - name: Capture and validate 42 full-system R3 views
        shell: bash
        run: |
          python - <<'PY'
          import json, os, time
          from pathlib import Path
          from urllib.parse import urlparse
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC

          target=os.environ['REVIEW_TARGET_SHA']; base=os.environ['QA_WEB_BASE_URL'].rstrip('/')
          out=Path(os.environ['REVIEW_DIR']); out.mkdir(parents=True,exist_ok=True); shots=[]

          def driver_new(w=1440,h=1000):
              o=webdriver.ChromeOptions()
              for a in ('--headless=new','--no-sandbox','--disable-dev-shm-usage','--disable-gpu','--force-device-scale-factor=1'): o.add_argument(a)
              o.add_argument(f'--window-size={w},{h}'); o.binary_location=os.environ['BROWSER_BIN']
              return webdriver.Chrome(options=o)

          def text(d): return d.find_element(By.TAG_NAME,'body').text
          def h1(d):
              hs=d.find_elements(By.TAG_NAME,'h1'); return hs[0].text.strip() if len(hs)==1 else f'<count:{len(hs)}>'
          def contains_ci(haystack,needle): return needle.casefold() in haystack.casefold()

          def wait_view(d,expected_h1=None,required=()):
              def ready(x):
                  hs=x.find_elements(By.TAG_NAME,'h1')
                  if len(hs)!=1 or not hs[0].is_displayed(): return False
                  if expected_h1 is not None and hs[0].text.strip()!=expected_h1: return False
                  body=x.find_element(By.TAG_NAME,'body').text
                  return all(contains_ci(body,r) for r in required)
              WebDriverWait(d,30).until(ready)

          def assert_copy(d,required=(),forbidden=(),expected_h1=None):
              body=text(d)
              if expected_h1 is not None: assert h1(d)==expected_h1, f'h1 {h1(d)!r} != {expected_h1!r}'
              for r in required: assert contains_ci(body,r), f'missing copy {r!r}'
              for f in forbidden: assert not contains_ci(body,f), f'stale copy {f!r}'

          def metrics(d):
              return d.execute_script("const r=document.documentElement; return {cw:r.clientWidth,sw:r.scrollWidth,sh:Math.max(r.scrollHeight,document.body.scrollHeight),h1:document.querySelectorAll('h1').length};")

          def shot(d,name,w,h):
              d.set_window_size(w,h); time.sleep(.3); m=metrics(d); ov=m['sw']-m['cw']
              assert ov<=2, f'{name} {w}: overflow {ov}'; assert m['h1']==1, f'{name} {w}: h1 {m["h1"]}'
              hh=min(max(int(m['sh'])+32,h),7000); d.set_window_size(w,hh); time.sleep(.12); d.execute_script('window.scrollTo(0,0)')
              p=out/f'{name}-{w}.png'; assert d.save_screenshot(str(p))
              shots.append({'name':name,'width':w,'height':hh,'overflow':ov,'h1':m['h1'],'url':d.current_url,'file':p.name})

          def pair(d,name,expected_h1=None,required=(),forbidden=()):
              wait_view(d,expected_h1,required); assert_copy(d,required,forbidden,expected_h1); shot(d,name,1440,1000)
              wait_view(d,expected_h1,required); assert_copy(d,required,forbidden,expected_h1); shot(d,name,390,844); d.set_window_size(1440,1000)

          def login(d,user):
              d.get(base+'/operator/login'); w=WebDriverWait(d,30); w.until(EC.visibility_of_element_located((By.ID,'operator-login')))
              d.find_element(By.ID,'operator-login').send_keys(user); d.find_element(By.ID,'operator-password').send_keys(os.environ['QA_OPERATOR_PASSWORD'])
              d.find_element(By.CSS_SELECTOR,'button[type="submit"]').click(); w.until(lambda x:'/operator/' in x.current_url and '/operator/login' not in x.current_url); wait_view(d)

          def go(d,route,expected_h1=None,required=()):
              if urlparse(d.current_url).path!=route:
                  links=d.find_elements(By.CSS_SELECTOR,f'a[href="{route}"]'); assert links, f'no Link {route} from {d.current_url}'
                  d.execute_script('arguments[0].click()',links[0]); WebDriverWait(d,30).until(lambda x:urlparse(x.current_url).path==route)
              wait_view(d,expected_h1,required)

          def diag(d,label):
              print(json.dumps({'failure':label,'url':d.current_url,'h1':h1(d),'body':text(d)[:3000]},ensure_ascii=False,indent=2))
              try:d.save_screenshot(str(out/f'failure-{label}.png'))
              except Exception:pass

          # Login screenshots, no authentication attempts.
          d=driver_new()
          try:
              d.get(base+'/operator/login'); WebDriverWait(d,30).until(EC.visibility_of_element_located((By.ID,'operator-login'))); shot(d,'operator-login',1440,1000); shot(d,'operator-login',390,844)
          finally:d.quit()

          # One operator login for all operator routes.
          d=driver_new()
          try:
              login(d,os.environ['QA_OPERATOR_LOGIN'])
              routes=[
                ('dashboard','/operator/dashboard','Tablero',('Tablero',),('Dashboard',)),
                ('claims','/operator/claims',None,(),()),('tasks','/operator/tasks','Tareas operativas',(),()),
                ('customers','/operator/customers',None,(),()),('policies','/operator/policies',None,(),()),
                ('renewals','/operator/renewals','Renovaciones',('Ciclo de vida de póliza',),('Policy Lifecycle',)),
                ('collections','/operator/collections','Cobranzas',('Operaciones de cobranzas',),('Collections Operations',)),
              ]
              for name,route,heading,req,forbid in routes:
                  try: go(d,route,heading,req); pair(d,name,heading,req,forbid)
                  except Exception: diag(d,name); raise
              go(d,'/operator/claims'); links=d.find_elements(By.CSS_SELECTOR,'a[href^="/operator/claims/"]'); assert links
              path=urlparse(links[0].get_attribute('href')).path; d.execute_script('arguments[0].click()',links[0]); WebDriverWait(d,30).until(lambda x:urlparse(x.current_url).path==path); wait_view(d); pair(d,'claim-detail')
          finally:d.quit()

          # One platform-admin login for all admin routes.
          d=driver_new()
          try:
              login(d,os.environ['QA_ADMIN_LOGIN'])
              routes=[
                ('workspace-admin','/operator/workspace',None,('Configuración de plataforma','Operación técnica'),('Custom Fields','Guidance','Automations','Imports gobernados')),
                ('analytics','/operator/analytics',None,(),()),
                ('pipelines','/operator/admin/pipelines','Administración de pipelines',('Configuración de plataforma','Versión de definición','Borradores'),('Platform Configuration','Definition version','Drafts')),
                ('communication-templates','/operator/admin/communication-templates','Plantillas de comunicación',('Plantillas de comunicación R3','Versión de definición'),('Communication Templates R3','Definition version')),
                ('custom-fields','/operator/admin/custom-fields','Campos personalizados',('Configuración de plataforma R3','Versión de definición'),('Platform Configuration R3','Definition version')),
                ('guidance','/operator/admin/guidance','Orientación',('Orientación de plataforma R3','Versión de definición'),('Platform Guidance R3','Definition version')),
                ('automations','/operator/admin/automations','Automatizaciones',(),()),
                ('imports','/operator/admin/imports','Importaciones gobernadas',('Importaciones gobernadas R3','Trabajos de importación'),('Governed Imports R3','Jobs de importación')),
                ('recovery','/operator/admin/recovery','Integraciones y recuperación',('Operaciones de recuperación R3','RECUPERACIÓN'),('Recovery Operations R3',)),
              ]
              for name,route,heading,req,forbid in routes:
                  try: go(d,route,heading,req); pair(d,name,heading,req,forbid)
                  except Exception: diag(d,name); raise
          finally:d.quit()

          # Public surfaces.
          d=driver_new()
          try:
              for name,route in [('public-home','/'),('public-claim-verify','/claims/new/verify'),('public-tracking','/claims/track')]:
                  d.get(base+route); wait_view(d); WebDriverWait(d,30).until(lambda x:contains_ci(text(x),'caso técnico no oficial')); pair(d,name)
          finally:d.quit()

          assert len(shots)==42, f'Expected 42 captures, got {len(shots)}'
          summary={'review_type':'r3_task12_full_system_visual_v6','review_target_sha':target,'capture_count':len(shots),'max_horizontal_overflow':max(s['overflow'] for s in shots),'all_single_h1':all(s['h1']==1 for s in shots),'operator_login_count':1,'admin_login_count':1,'real_link_navigation':'PASS','case_insensitive_copy_assertions':'PASS','shots':shots,'result':'PASS'}
          (out/'visual-review.json').write_text(json.dumps(summary,indent=2),encoding='utf-8'); print(json.dumps(summary,indent=2))
          PY

      - name: Assert no unhandled API errors
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'UNHANDLED_API_ERROR' "$REVIEW_DIR/api.log"; then cat "$REVIEW_DIR/api.log"; exit 1; fi

      - name: Upload final Task 12 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r3-task12-full-system-visual-v6-${{ env.REVIEW_TARGET_SHA }}
          path: |
            .runtime/r3-task12-visual-v6/*.png
            .runtime/r3-task12-visual-v6/visual-review.json
            .runtime/r3-task12-visual-v6/api.log
            .runtime/r3-task12-visual-v6/web.log
            .runtime/r3-task12-visual-v6/legacy.log
          retention-days: 30

      - name: Stop review stack
        if: always()
        shell: bash
        run: |
          for pidfile in "$REVIEW_DIR"/*.pid; do [[ -f "$pidfile" ]] || continue; kill "$(cat "$pidfile")" 2>/dev/null || true; done
