name: Public Home Viewport

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/src/pages/HomePage.tsx'
      - 'apps/web/src/components/PublicShell.tsx'
      - 'apps/web/src/public-refresh.css'
      - 'apps/web/src/public-refresh-fixes.css'
      - 'apps/web/src/hero-hq.css'
      - 'apps/web/src/public-customer-journey-r3.css'
      - 'apps/web/src/public-home-density.css'
      - 'qa/public-home-viewport-qa.py'
      - '.github/workflows/public-home-viewport.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  viewport:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Start web client
        run: |
          npm run dev --workspace=@insurance/web -- --host 127.0.0.1 > .runtime-public-home-web.log 2>&1 &
          echo $! > .runtime-public-home-web.pid
          for attempt in $(seq 1 40); do
            curl -fsS http://127.0.0.1:5173/ >/dev/null 2>&1 && exit 0
            if [[ "$attempt" == "40" ]]; then
              cat .runtime-public-home-web.log || true
              exit 1
            fi
            sleep 1
          done

      - name: Prepare Chrome QA
        run: |
          python -m pip install --disable-pip-version-check selenium==4.35.0
          browser_bin="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [[ -z "$browser_bin" ]]; then
            echo "No supported Chrome/Chromium binary found on runner" >&2
            exit 1
          fi
          echo "BROWSER_BIN=$browser_bin" >> "$GITHUB_ENV"
          "$browser_bin" --version

      - name: Verify public home density and target viewports
        env:
          QA_WEB_BASE_URL: http://127.0.0.1:5173
        run: python qa/public-home-viewport-qa.py

      - name: Upload public home screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-home-viewport-${{ github.event.pull_request.head.sha || github.sha }}
          path: .qa-artifacts/public-home/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Runtime logs on failure
        if: failure()
        run: |
          cat .runtime-public-home-web.log || true

      - name: Stop runtime services
        if: always()
        run: |
          pkill -f 'vite --host 127.0.0.1' 2>/dev/null || true
          [[ -f .runtime-public-home-web.pid ]] && kill "$(cat .runtime-public-home-web.pid)" 2>/dev/null || true
