name: R3 Task 10 Async Store Fix

on:
  push:
    branches: [review/r3-task10-async-store-fix]

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/r3-parallel-11-imports-recovery
          fetch-depth: 0
      - name: Verify expected product head
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "f89544dd0b409b64171a1264f8189ba5eb3ee0b2"
      - name: Apply exact ORM correction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('packages/infrastructure/src/async-store.ts')
          source = path.read_text()
          old = "const rows = await this.db.orm.public.AsyncJob.all({ status: 'DEAD_LETTER' });"
          new = "const rows = await this.db.orm.public.AsyncJob.where({ status: 'DEAD_LETTER' }).all();"
          if source.count(old) != 1:
              raise SystemExit(f'Expected exactly one legacy query, found {source.count(old)}')
          path.write_text(source.replace(old, new))
          PY
          git diff --check
          git diff -- packages/infrastructure/src/async-store.ts
          test "$(git diff --numstat -- packages/infrastructure/src/async-store.ts | awk '{print $1":"$2}')" = "1:1"
      - name: Commit and push product fix
        shell: bash
        run: |
          git config user.name "MSc Luis A. Hernández Elias"
          git config user.email "88979457+LuisHdezE@users.noreply.github.com"
          git add packages/infrastructure/src/async-store.ts
          git commit -m "fix(infrastructure): query dead letters through ORM filter"
          git push origin HEAD:feat/r3-parallel-11-imports-recovery
