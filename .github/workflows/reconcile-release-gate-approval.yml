name: Reconcile Release Gate Approval

on:
  push:
    branches:
      - blueprint/release-gate
    paths:
      - .github/workflows/reconcile-release-gate-approval.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: blueprint/release-gate
          fetch-depth: 0
      - name: Record explicit human Release Gate approval
        run: |
          python - <<'PY'
          from pathlib import Path

          status_path = Path('.blueprint/status.yaml')
          text = status_path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one anchor, found {count}')
              text = text.replace(old, new, 1)

          approval_id = 'EVD-RELEASE-GATE-APPROVAL-001'
          approval_path = Path('documentation/release/RELEASE_GATE_APPROVAL.md')
          if approval_id in text or approval_path.exists():
              raise SystemExit('Release Gate approval already appears to be recorded')

          replace_once(
              "updated_at: '2026-09-06T23:57:03-03:00'",
              "updated_at: '2026-09-07T05:09:00-03:00'",
              'updated_at',
          )

          phase_old = (
              '  release_gate:\n'
              '    status: READY_FOR_REVIEW\n'
              '    progress: 80\n'
              '    note: All four applicable Release Gate checks passed on exact machine-tested candidate 22ae0618cf865a8c940a2c9c3c243a1830cd4d97; explicit human Release Gate approval remains pending.\n'
          )
          phase_new = (
              '  release_gate:\n'
              '    status: COMPLETE\n'
              '    progress: 100\n'
              '    note: Explicit human Release Gate approval recorded on 2026-09-07 after all four applicable release checks and 16/16 exact-head PR workflows passed for candidate 05bb93081248c02ecfb93b7b77477bd4862d3281.\n'
          )
          replace_once(phase_old, phase_new, 'release phase')

          gate_old = (
              '  release_gate:\n'
              '    status: READY_FOR_REVIEW\n'
              "    evaluated_at: '2026-09-06T23:57:03-03:00'\n"
              '    note: Machine Release Gate evidence is complete on run 34077824586; human Release Gate decision remains pending and cannot be inferred by CI.\n'
              '    evidence_ids: [EVD-RELEASE-GATE-001]\n'
          )
          gate_new = (
              '  release_gate:\n'
              '    status: PASS\n'
              "    evaluated_at: '2026-09-07T05:09:00-03:00'\n"
              '    note: Explicit human Release Gate approval by Luis Hernández recorded after exact-head release evidence and full PR regression success; this decision does not authorize merge.\n'
              '    evidence_ids: [EVD-RELEASE-GATE-001, EVD-RELEASE-GATE-APPROVAL-001]\n'
          )
          replace_once(gate_old, gate_new, 'project release gate')

          artifact = (
              '  - id: EVD-RELEASE-GATE-APPROVAL-001\n'
              '    type: manual_approval\n'
              '    value: documentation/release/RELEASE_GATE_APPROVAL.md\n'
          )
          text = text.rstrip() + '\n' + artifact

          if '\n  operations_maintenance:' in text or '\n  operations:' in text:
              raise SystemExit('Operations must not be started by Release Gate approval recording')

          status_path.write_text(text, encoding='utf-8')

          approval_path.write_text('''# Release Gate Approval\n\n- Evidence ID: `EVD-RELEASE-GATE-APPROVAL-001`\n- Blueprint baseline: `0.5.2`\n- Decision: `PASS`\n- Approved release candidate: `05bb93081248c02ecfb93b7b77477bd4862d3281`\n- Accepted baseline: `ba7f519f36567b142604e213f50e13de4732348d`\n- Pull request: `#20`\n- Approver: Luis Hernández\n- Approved at: `2026-09-07T05:09:00-03:00`\n- Timezone: `America/Montevideo`\n\n## Explicit human decision\n\n> Apruebo Release Gate\n\n## Preconditions verified before approval\n\n- `release.functional_slices_accepted`: `PASS`\n- `release.security_accepted`: `PASS`\n- `release.documentation`: `PASS`\n- `release.backup_restore`: `PASS`\n- Exact-head pull-request regression on the approved candidate: `16/16 SUCCESS`\n- Product/API capability drift from accepted baseline: none\n- All three web slices remain lifecycle `ACCEPTED` with Integration QA `PASS` and Human Acceptance `APPROVED`\n\n## Approval meaning\n\nThis human decision promotes the project-scoped Blueprint Release Gate from `READY_FOR_REVIEW` to `PASS` and the Release Gate phase from `80%` to `COMPLETE / 100%`. It approves the release readiness evidence for this MVP scope.\n\nThe recoverability evidence is limited to repository-schema PostgreSQL backup/restore proof and does not claim FAR production infrastructure, scheduled backup policy, HA/replication, RPO/RTO or disaster-recovery topology.\n\n## Governance boundary\n\nThis Release Gate approval does **not** authorize merge of PR #20. Merge approval remains a separate explicit human decision. It also does not auto-start deployment or Operations & Maintenance.\n''', encoding='utf-8')
          PY
      - name: Validate and commit approval record
        run: |
          git diff --check
          grep -A3 '^  release_gate:' .blueprint/status.yaml | head -n4
          grep -A4 '^  release_gate:' .blueprint/status.yaml | tail -n5
          grep -A2 '^  - id: EVD-RELEASE-GATE-APPROVAL-001' .blueprint/status.yaml
          test -f documentation/release/RELEASE_GATE_APPROVAL.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .blueprint/status.yaml documentation/release/RELEASE_GATE_APPROVAL.md
          git rm .github/workflows/reconcile-release-gate-approval.yml
          git commit -m "chore(blueprint): record Release Gate approval"
          git push origin HEAD:blueprint/release-gate
