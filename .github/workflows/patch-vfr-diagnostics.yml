name: Patch VFR Diagnostics

on:
  push:
    branches: [blueprint/visual-functional-review-web]
    paths:
      - .github/workflows/patch-vfr-diagnostics.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: blueprint/visual-functional-review-web
          fetch-depth: 0
      - name: Add route/body diagnostics to browser waits
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('qa/visual-functional-review-browser.py')
          text = path.read_text(encoding='utf-8')
          old_import = 'from selenium.webdriver.common.by import By\n'
          new_import = 'from selenium.common.exceptions import TimeoutException\nfrom selenium.webdriver.common.by import By\n'
          if old_import not in text:
              raise SystemExit('Expected selenium import anchor not found')
          text = text.replace(old_import, new_import, 1)
          old = '''def wait_text(text: str) -> None:
              wait.until(lambda d: text in d.find_element(By.TAG_NAME, "body").text)
          '''
          new = '''def wait_text(text: str) -> None:
              try:
                  wait.until(lambda d: text in d.find_element(By.TAG_NAME, "body").text)
              except TimeoutException as error:
                  body = driver.find_element(By.TAG_NAME, "body").text
                  severe = [item.get("message", "") for item in driver.get_log("browser") if item.get("level") == "SEVERE"]
                  raise AssertionError(
                      f"Timed out waiting for {text!r}; url={driver.current_url!r}; body={body[:2500]!r}; severe={severe[:10]!r}"
                  ) from error
          '''
          if old not in text:
              raise SystemExit('Expected wait_text anchor not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          git diff -- qa/visual-functional-review-browser.py
      - name: Commit harness diagnostics
        run: |
          git config user.name "MSc Luis A. Hernández Elias"
          git config user.email "88979457+LuisHdezE@users.noreply.github.com"
          git add qa/visual-functional-review-browser.py
          git commit -m "test(ui): include route diagnostics in visual review waits"
          git push origin HEAD:blueprint/visual-functional-review-web
