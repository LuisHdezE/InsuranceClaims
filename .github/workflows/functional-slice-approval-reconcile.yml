name: Reconcile Functional Slice Approval

on:
  push:
    branches: [blueprint/functional-slice-digital-claim-intake-web]
    paths:
      - .github/workflows/functional-slice-approval-reconcile.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: blueprint/functional-slice-digital-claim-intake-web
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Reconcile approved scoped Blueprint state
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = '.blueprint/status.yaml';
          let text = fs.readFileSync(file, 'utf8');
          const replaceOnce = (from, to, label) => {
            const first = text.indexOf(from);
            const last = text.lastIndexOf(from);
            if (first < 0 || first !== last) throw new Error(`Expected exactly one ${label} anchor`);
            text = text.replace(from, to);
          };

          replaceOnce(
            "updated_at: '2026-09-06T07:02:00-03:00'",
            "updated_at: '2026-09-06T07:12:37-03:00'",
            'updated_at',
          );

          replaceOnce(
            '    note: digital-claim-intake/web is READY_FOR_REVIEW after exact-head functional, real-API, security, responsive and accessibility validation; customer-claim-tracking/web and claims-backoffice/web remain pending.',
            '    note: digital-claim-intake/web is FUNCTIONAL after explicit human Functional Slice Ready approval and exact reviewed-head validation; customer-claim-tracking/web and claims-backoffice/web remain pending.',
            'functional phase note',
          );

          replaceOnce(
            "  - gate: functional_slice_ready\n    scope: interface_slice_platform\n    scope_id: digital-claim-intake\n    platform: web\n    status: READY_FOR_REVIEW\n    note: All canonical functional slice checks plus applicable idempotency are evidenced for the real API-backed web intake; explicit human gate approval remains pending before lifecycle FUNCTIONAL.\n    evidence_ids: [EVD-FUNCTIONAL-INTAKE-WEB-001]",
            "  - gate: functional_slice_ready\n    scope: interface_slice_platform\n    scope_id: digital-claim-intake\n    platform: web\n    status: PASS\n    evaluated_at: '2026-09-06T07:12:37-03:00'\n    note: Explicit human Functional Slice Ready approval recorded for digital-claim-intake/web after exact-head 8/8 workflow success; lifecycle is now FUNCTIONAL.\n    evidence_ids: [EVD-FUNCTIONAL-INTAKE-WEB-001, EVD-FUNCTIONAL-INTAKE-WEB-APPROVAL-001]",
            'scoped functional gate',
          );

          replaceOnce(
            "  - id: EVD-FUNCTIONAL-INTAKE-WEB-001\n    type: functional_slice_evidence\n    value: documentation/functional-slices/DIGITAL_CLAIM_INTAKE_WEB_EVIDENCE.md",
            "  - id: EVD-FUNCTIONAL-INTAKE-WEB-001\n    type: functional_slice_evidence\n    value: documentation/functional-slices/DIGITAL_CLAIM_INTAKE_WEB_EVIDENCE.md\n  - id: EVD-FUNCTIONAL-INTAKE-WEB-APPROVAL-001\n    type: manual_approval\n    value: documentation/functional-slices/DIGITAL_CLAIM_INTAKE_WEB_APPROVAL.md",
            'approval artifact',
          );

          fs.writeFileSync(file, text);
          NODE

          grep -q "status: PASS" .blueprint/status.yaml
          grep -q "EVD-FUNCTIONAL-INTAKE-WEB-APPROVAL-001" .blueprint/status.yaml
          grep -q "digital-claim-intake/web is FUNCTIONAL" .blueprint/status.yaml
          git diff --check
          git diff -- .blueprint/status.yaml
      - name: Commit reconciled approval state
        run: |
          git config user.name "MSc Luis A. Hernández Elias"
          git config user.email "88979457+LuisHdezE@users.noreply.github.com"
          git add .blueprint/status.yaml
          git commit -m "chore(blueprint): record intake functional gate pass"
          git push origin HEAD:blueprint/functional-slice-digital-claim-intake-web
