name: Claims Operations Release Formalization 0.2.0

on:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'apps/**/package.json'
      - 'packages/**/package.json'
      - 'documentation/release/CLAIMS_OPERATIONS_RELEASE_0.2.0.md'
      - 'documentation/portfolio/RELEASE_NOTES_v0.2.0.md'
      - 'documentation/api/post-mvp/baselines/openapi-v1-r1.yaml'
      - 'scripts/validate-release-formalization-0.2.0.mjs'
      - '.github/workflows/release-formalization-0.2.0.yml'
  push:
    branches:
      - main
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'apps/**/package.json'
      - 'packages/**/package.json'
      - 'documentation/release/CLAIMS_OPERATIONS_RELEASE_0.2.0.md'
      - 'documentation/portfolio/RELEASE_NOTES_v0.2.0.md'
      - 'documentation/api/post-mvp/baselines/openapi-v1-r1.yaml'
      - 'scripts/validate-release-formalization-0.2.0.mjs'
      - '.github/workflows/release-formalization-0.2.0.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-formalization-0.2.0-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-release-formalization:
    name: Release Formalization 0.2.0
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Verify package-lock reproducibility
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Detect active release identity
        id: release-identity
        shell: bash
        run: |
          set -euo pipefail
          current_version=$(node -p "require('./package.json').version")
          echo "version=${current_version}" >> "$GITHUB_OUTPUT"
          if [[ "${current_version}" == '0.2.0' ]]; then
            echo 'mode=formalization' >> "$GITHUB_OUTPUT"
            echo 'Claims Operations 0.2.0 is the active package identity; validating original formalization.'
          else
            echo 'mode=historical-preservation' >> "$GITHUB_OUTPUT"
            echo "Current package identity is ${current_version}; validating immutable published v0.2.0 history instead."
          fi

      - name: Validate release identity and governed evidence chain
        if: steps.release-identity.outputs.mode == 'formalization'
        run: node scripts/validate-release-formalization-0.2.0.mjs

      - name: Verify published v0.2.0 remains immutable after later releases
        if: steps.release-identity.outputs.mode == 'historical-preservation'
        shell: bash
        env:
          RELEASE_TAG: v0.2.0
          RELEASE_COMMIT: 9265417849f398f5d1efa56b7cd8ff365b950dbb
        run: |
          set -euo pipefail
          test "$(git rev-parse "${RELEASE_TAG}^{commit}")" = "${RELEASE_COMMIT}"
          git cat-file -e "${RELEASE_TAG}:package.json"
          git cat-file -e "${RELEASE_TAG}:package-lock.json"
          git cat-file -e "${RELEASE_TAG}:documentation/release/CLAIMS_OPERATIONS_RELEASE_0.2.0.md"
          git cat-file -e "${RELEASE_TAG}:documentation/portfolio/RELEASE_NOTES_v0.2.0.md"
          mkdir -p .runtime
          git show "${RELEASE_TAG}:package.json" > .runtime/v0.2.0-package.json
          test "$(node -p "require('./.runtime/v0.2.0-package.json').version")" = '0.2.0'
          echo "Published ${RELEASE_TAG} immutable target: PASS"
          echo "Published ${RELEASE_TAG} release evidence availability: PASS"

      - name: Verify historical v0.1.0 evidence is unchanged
        shell: bash
        env:
          HISTORICAL_BASELINE_SHA: 531828a18babaca563c83dd76df56b725d6105f0
          HISTORICAL_PROJECT_BLOB: 96ac7c83c11d4e996127b6352e0a00de6961347e
          HISTORICAL_STATUS_BLOB: 1c21a364a109da111230b9da9225696f4a581581
          HISTORICAL_OPENAPI_ARCHIVE: documentation/api/post-mvp/baselines/openapi-v1-r1.yaml
        run: |
          set -euo pipefail
          git cat-file -e "${HISTORICAL_BASELINE_SHA}^{commit}"

          # Project/status are living Blueprint consumer state. Preserve the exact
          # v0.1.0 snapshots by their immutable blobs rather than requiring the
          # current files to remain frozen forever.
          test "$(git rev-parse "${HISTORICAL_BASELINE_SHA}:.blueprint/project.yaml")" = "${HISTORICAL_PROJECT_BLOB}"
          test "$(git rev-parse "${HISTORICAL_BASELINE_SHA}:.blueprint/status.yaml")" = "${HISTORICAL_STATUS_BLOB}"
          git cat-file -e "${HISTORICAL_PROJECT_BLOB}^{blob}"
          git cat-file -e "${HISTORICAL_STATUS_BLOB}^{blob}"

          # All other historical release evidence remains byte-identical in the
          # living tree and therefore retains the stronger current-vs-baseline diff.
          git diff --exit-code "${HISTORICAL_BASELINE_SHA}" -- \
            .blueprint/ui/interface-inventory.json \
            documentation/api/API_CONTRACT.md \
            documentation/api/API_ENDPOINT_INVENTORY.json \
            documentation/release/RELEASE_READINESS.md \
            documentation/release/RELEASE_GATE_EVIDENCE.md \
            documentation/release/RELEASE_GATE_APPROVAL.md \
            documentation/operations \
            documentation/visual-functional-review \
            documentation/portfolio/RELEASE_NOTES_v0.1.0.md

          mkdir -p .runtime
          git show "${HISTORICAL_BASELINE_SHA}:openapi.yaml" > .runtime/openapi-v1-r1-historical.yaml
          cmp --silent .runtime/openapi-v1-r1-historical.yaml "${HISTORICAL_OPENAPI_ARCHIVE}"
          test "$(git hash-object "${HISTORICAL_OPENAPI_ARCHIVE}")" = "868fcb74f57d507dd1ef27fa24518357287dd3ff"
          echo 'Historical v0.1.0 evidence preservation: PASS'
          echo 'Historical v0.1.0 project/status blob identity: PASS'
          echo 'Historical api-v1-r1 OpenAPI archive byte identity: PASS'
