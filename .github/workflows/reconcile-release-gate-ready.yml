name: Reconcile Release Gate Ready

on:
  push:
    branches:
      - blueprint/release-gate
    paths:
      - .github/workflows/reconcile-release-gate-ready.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: blueprint/release-gate
          fetch-depth: 0
      - name: Reconcile Release Gate candidate state
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.blueprint/status.yaml')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one anchor, found {count}')
              text = text.replace(old, new, 1)

          if '  release_gate:\n' in text or '  release.functional_slices_accepted:\n' in text or 'EVD-RELEASE-GATE-001' in text:
              raise SystemExit('Release Gate candidate state already appears in status.yaml')

          replace_once(
              "updated_at: '2026-09-06T23:15:34-03:00'",
              "updated_at: '2026-09-06T23:57:03-03:00'",
              'updated_at',
          )

          phase_anchor = (
              '  integration_qa:\n'
              '    status: COMPLETE\n'
              '    progress: 100\n'
              '    note: digital-claim-intake/web, customer-claim-tracking/web and claims-backoffice/web all passed Integration QA after exact-head real-dependency validation and explicit human approval on 2026-09-06.\n'
              'checks:\n'
          )
          phase_replacement = (
              '  integration_qa:\n'
              '    status: COMPLETE\n'
              '    progress: 100\n'
              '    note: digital-claim-intake/web, customer-claim-tracking/web and claims-backoffice/web all passed Integration QA after exact-head real-dependency validation and explicit human approval on 2026-09-06.\n'
              '  release_gate:\n'
              '    status: READY_FOR_REVIEW\n'
              '    progress: 80\n'
              '    note: All four applicable Release Gate checks passed on exact machine-tested candidate 22ae0618cf865a8c940a2c9c3c243a1830cd4d97; explicit human Release Gate approval remains pending.\n'
              'checks:\n'
          )
          replace_once(phase_anchor, phase_replacement, 'release phase')

          checks = (
              '  release.functional_slices_accepted:\n'
              '    status: PASS\n'
              '    verification: evidence\n'
              '    note: The committed release scope is exactly the three web slices, all lifecycle ACCEPTED with DoD, V&F, Integration QA and Human Acceptance prerequisites complete.\n'
              '    evidence_ids: [EVD-RELEASE-GATE-001]\n'
              '  release.security_accepted:\n'
              '    status: PASS\n'
              '    verification: evidence\n'
              '    note: Approved security/threat and runtime security evidence remains valid; exact-head production dependency audit reports zero vulnerabilities.\n'
              '    evidence_ids: [EVD-RELEASE-GATE-001]\n'
              '  release.documentation:\n'
              '    status: PASS\n'
              '    verification: evidence\n'
              '    note: Release scope, setup, verification, runtime, limitations, security aggregation, rollback posture and decision boundary are versioned and reproducible.\n'
              '    evidence_ids: [EVD-RELEASE-GATE-001]\n'
              '  release.backup_restore:\n'
              '    status: PASS\n'
              '    verification: evidence\n'
              '    note: PostgreSQL 18 pg_dump/pg_restore proof restored six authoritative tables and verified synthetic claim, audit and idempotency sentinels in a distinct database.\n'
              '    evidence_ids: [EVD-RELEASE-GATE-001]\n'
          )
          replace_once('\ngates:\n', '\n' + checks + 'gates:\n', 'release checks')

          gate_anchor = (
              '  design_system_ready:\n'
              '    status: PASS\n'
              "    evaluated_at: '2026-09-06T00:39:18-03:00'\n"
              '    note: Explicit human Design System Ready approval recorded after revised FAR identity/logo validation and exact-head success of Design System, Interface Inventory and full API regressions.\n'
              '    evidence_ids: [EVD-DESIGN-SYSTEM-001, EVD-DESIGN-TOKENS-001, EVD-DESIGN-SYSTEM-EVIDENCE-001, EVD-DESIGN-SYSTEM-VALIDATION-001, EVD-DESIGN-LOGO-001, EVD-DESIGN-LANDING-REFERENCE-001, EVD-DESIGN-SYSTEM-READY-APPROVAL-001]\n'
              'functional_slices:\n'
          )
          gate_replacement = (
              '  design_system_ready:\n'
              '    status: PASS\n'
              "    evaluated_at: '2026-09-06T00:39:18-03:00'\n"
              '    note: Explicit human Design System Ready approval recorded after revised FAR identity/logo validation and exact-head success of Design System, Interface Inventory and full API regressions.\n'
              '    evidence_ids: [EVD-DESIGN-SYSTEM-001, EVD-DESIGN-TOKENS-001, EVD-DESIGN-SYSTEM-EVIDENCE-001, EVD-DESIGN-SYSTEM-VALIDATION-001, EVD-DESIGN-LOGO-001, EVD-DESIGN-LANDING-REFERENCE-001, EVD-DESIGN-SYSTEM-READY-APPROVAL-001]\n'
              '  release_gate:\n'
              '    status: READY_FOR_REVIEW\n'
              "    evaluated_at: '2026-09-06T23:57:03-03:00'\n"
              '    note: Machine Release Gate evidence is complete on run 34077824586; human Release Gate decision remains pending and cannot be inferred by CI.\n'
              '    evidence_ids: [EVD-RELEASE-GATE-001]\n'
              'functional_slices:\n'
          )
          replace_once(gate_anchor, gate_replacement, 'project release gate')

          artifact = (
              '  - id: EVD-RELEASE-GATE-001\n'
              '    type: release_gate_evidence\n'
              '    value: documentation/release/RELEASE_GATE_EVIDENCE.md\n'
          )
          text = text.rstrip() + '\n' + artifact

          if '\n  operations_maintenance:' in text or '\n  operations:' in text:
              raise SystemExit('Operations must not be started while Release Gate awaits human approval')

          path.write_text(text, encoding='utf-8')
          PY
      - name: Validate and commit reconciled checkpoint
        run: |
          git diff --check
          grep -A3 '^  release_gate:' .blueprint/status.yaml | head -n4
          grep -A4 '^  release.functional_slices_accepted:' .blueprint/status.yaml
          grep -A4 '^  release.backup_restore:' .blueprint/status.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .blueprint/status.yaml
          git rm .github/workflows/reconcile-release-gate-ready.yml
          git commit -m "chore(blueprint): mark Release Gate ready for review"
          git push origin HEAD:blueprint/release-gate
