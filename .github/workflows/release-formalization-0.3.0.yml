name: R3 Release Formalization 0.3.0

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/release-formalization-0.3.0.yml'
      - 'scripts/validate-release-formalization-0.3.0.mjs'
      - 'documentation/release/R3_RELEASE_FORMALIZATION_0.3.0.md'
      - 'documentation/release/R3_RELEASE_PUBLICATION_LINEAGE_RECONCILIATION.md'
      - 'documentation/portfolio/RELEASE_NOTES_v0.3.0.md'
      - 'documentation/portfolio/GITHUB_RELEASE_BODY_v0.3.0.md'
      - 'documentation/portfolio/R3_RELEASE_PUBLICATION_GATE_0.3.0.md'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-formalization-0.3.0.yml'
      - 'scripts/validate-release-formalization-0.3.0.mjs'
      - 'documentation/release/R3_RELEASE_FORMALIZATION_0.3.0.md'
      - 'documentation/release/R3_RELEASE_PUBLICATION_LINEAGE_RECONCILIATION.md'
      - 'documentation/portfolio/RELEASE_NOTES_v0.3.0.md'
      - 'documentation/portfolio/GITHUB_RELEASE_BODY_v0.3.0.md'
      - 'documentation/portfolio/R3_RELEASE_PUBLICATION_GATE_0.3.0.md'

permissions:
  contents: read

concurrency:
  group: r3-release-formalization-0.3.0-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RELEASE_TAG: v0.3.0
  RELEASE_COMMIT: 014b2a4c4c38d94b07346aaa54bc32a8bbb7c5f9
  RELEASE_TAG_OBJECT: 20c9d933e89854229259819ccbbb71b1a72a08fc
  RELEASE_ID: '388080952'
  RELEASE_NAME: Insurance Claims Legacy Modernization — R3 Full Product v0.3.0
  RELEASE_PUBLISHED_AT: '2026-09-14T00:27:06Z'
  PREVIOUS_RELEASE_COMMIT: 9265417849f398f5d1efa56b7cd8ff365b950dbb

jobs:
  validate-release-formalization:
    name: R3 Release Formalization 0.3.0
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Validate historical formalization and publication integrity
        run: node scripts/validate-release-formalization-0.3.0.mjs

      - name: Verify remote v0.3.0 publication integrity
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth=(-H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28")

          ref_json=$(curl --fail-with-body -sS "${auth[@]}" "${api}/git/ref/tags/${RELEASE_TAG}")
          test "$(jq -r '.object.type' <<<"${ref_json}")" = 'tag'
          test "$(jq -r '.object.sha' <<<"${ref_json}")" = "${RELEASE_TAG_OBJECT}"

          tag_json=$(curl --fail-with-body -sS "${auth[@]}" "${api}/git/tags/${RELEASE_TAG_OBJECT}")
          test "$(jq -r '.tag' <<<"${tag_json}")" = "${RELEASE_TAG}"
          test "$(jq -r '.object.type' <<<"${tag_json}")" = 'commit'
          test "$(jq -r '.object.sha' <<<"${tag_json}")" = "${RELEASE_COMMIT}"
          test "$(jq -r '.message' <<<"${tag_json}")" = "${RELEASE_NAME}"

          release_json=$(curl --fail-with-body -sS "${auth[@]}" "${api}/releases/tags/${RELEASE_TAG}")
          test "$(jq -r '.id | tostring' <<<"${release_json}")" = "${RELEASE_ID}"
          test "$(jq -r '.tag_name' <<<"${release_json}")" = "${RELEASE_TAG}"
          test "$(jq -r '.target_commitish' <<<"${release_json}")" = "${RELEASE_COMMIT}"
          test "$(jq -r '.name' <<<"${release_json}")" = "${RELEASE_NAME}"
          test "$(jq -r '.draft' <<<"${release_json}")" = 'false'
          test "$(jq -r '.prerelease' <<<"${release_json}")" = 'false'
          test "$(jq -r '.published_at' <<<"${release_json}")" = "${RELEASE_PUBLISHED_AT}"

          expected_body=$(cat documentation/portfolio/GITHUB_RELEASE_BODY_v0.3.0.md)
          actual_body=$(jq -r '.body' <<<"${release_json}")
          test "${actual_body}" = "${expected_body}"

          previous_ref=$(curl --fail-with-body -sS "${auth[@]}" "${api}/git/ref/tags/v0.2.0")
          test "$(jq -r '.object.type' <<<"${previous_ref}")" = 'tag'
          previous_tag_object=$(jq -r '.object.sha' <<<"${previous_ref}")
          previous_tag=$(curl --fail-with-body -sS "${auth[@]}" "${api}/git/tags/${previous_tag_object}")
          test "$(jq -r '.object.sha' <<<"${previous_tag}")" = "${PREVIOUS_RELEASE_COMMIT}"

      - name: Publication integrity summary
        shell: bash
        run: |
          echo 'R3_RELEASE_PUBLICATION_INTEGRITY_0_3_0_PASS'
          echo "checked_sha=$(git rev-parse HEAD)"
          echo "release_commit=${RELEASE_COMMIT}"
          echo "release_tag=${RELEASE_TAG}"
          echo "release_tag_object=${RELEASE_TAG_OBJECT}"
          echo "release_id=${RELEASE_ID}"
          echo 'historical_publication_run=34792695296'
          echo 'publication_status=PUBLISHED_IMMUTABLE'
          echo 'publication_side_effects=NONE'
