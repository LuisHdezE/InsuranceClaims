name: R3 Parallel Sync Visual Review V2

on:
  push:
    branches: [review/r3-parallel-sync-visual-v2]

permissions:
  contents: read

jobs:
  exact-head-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: insuranceclaims_r3_parallel_visual_v2
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d insuranceclaims_r3_parallel_visual_v2"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      REVIEW_TARGET_SHA: ec03d5bd9371029aad9d23591312b63dc2a0ac51
      REVIEW_DIR: .runtime/r3-parallel-sync-visual-v2
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/insuranceclaims_r3_parallel_visual_v2
      LEGACY_SIMULATOR_URL: http://127.0.0.1:3200
      LEGACY_SIMULATOR_PORT: '3200'
      PORT: '3000'
      QA_BASE_URL: http://127.0.0.1:3000
      QA_WEB_BASE_URL: http://127.0.0.1:5173
      QA_OPERATOR_LOGIN: qa.operator@example.invalid
      QA_ADMIN_LOGIN: qa.admin@example.invalid
      QA_SUPERVISOR_LOGIN: qa.supervisor@example.invalid
      QA_CUSTOMER_LOGIN: qa.customer@example.invalid
      EVIDENCE_STORAGE_DIR: .runtime/evidence-r3-parallel-visual-v2
      IMPORT_SOURCE_STORAGE_DIR: .runtime/imports-r3-parallel-visual-v2
      COLLECTION_PAYMENT_STATE_VALUES_JSON: '["DEMO_STATE_A","DEMO_STATE_B"]'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ec03d5bd9371029aad9d23591312b63dc2a0ac51
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Verify exact synchronized product head
        run: test "$(git rev-parse HEAD)" = "$REVIEW_TARGET_SHA"

      - name: Install dependencies and browser harness
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          python -m pip install --disable-pip-version-check selenium==4.35.0
          browser_bin="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$browser_bin"
          echo "BROWSER_BIN=$browser_bin" >> "$GITHUB_ENV"
          echo "JWT_SECRET=r3-parallel-visual-v2-$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "CUSTOMER_JWT_SECRET=r3-parallel-visual-v2-customer-$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "QA_OPERATOR_PASSWORD=R3-parallel-visual-v2-$(openssl rand -hex 16)!" >> "$GITHUB_ENV"
          echo "QA_CUSTOMER_PASSWORD=R3-parallel-customer-v2-$(openssl rand -hex 16)!" >> "$GITHUB_ENV"

      - name: Emit Prisma 8 contract
        run: npm run contract:emit

      - name: Bootstrap PostgreSQL and synthetic identities
        shell: bash
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f qa/bootstrap.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f qa/r3-insurer-guidance.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f prisma/migrations/20260909_09_customer_portal_r3.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f prisma/migrations/20260909_10_governed_imports_r3.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f prisma/migrations/20260909_01_renewals_r3.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f prisma/migrations/20260909_02_collections_r3.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f prisma/migrations/20260909_03_custom_fields_r3.sql
          npx tsx qa/seed.ts

      - name: Start real review stack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$REVIEW_DIR" "$EVIDENCE_STORAGE_DIR" "$IMPORT_SOURCE_STORAGE_DIR"
          npm run start:legacy > "$REVIEW_DIR/legacy.log" 2>&1 &
          echo $! > "$REVIEW_DIR/legacy.pid"
          npm run start:api > "$REVIEW_DIR/api.log" 2>&1 &
          echo $! > "$REVIEW_DIR/api.pid"
          npm run dev --workspace=@insurance/web -- --host 127.0.0.1 > "$REVIEW_DIR/web.log" 2>&1 &
          echo $! > "$REVIEW_DIR/web.pid"
          for attempt in $(seq 1 60); do
            legacy_ok=0; api_ok=0; web_ok=0
            curl -fsS -X POST -H 'content-type: application/json' -d '{"policy_no":"SYN-POL-001","vehicle_ref":"SYN-VEH-001"}' http://127.0.0.1:3200/legacy/v1/policy-vehicle/verify >/dev/null 2>&1 && legacy_ok=1 || true
            curl -fsS http://127.0.0.1:3000/health/live >/dev/null 2>&1 && api_ok=1 || true
            curl -fsS http://127.0.0.1:5173/ >/dev/null 2>&1 && web_ok=1 || true
            if [[ "$legacy_ok" == 1 && "$api_ok" == 1 && "$web_ok" == 1 ]]; then exit 0; fi
            sleep 1
          done
          cat "$REVIEW_DIR/api.log" || true
          cat "$REVIEW_DIR/web.log" || true
          exit 1

      - name: Capture 22 synchronized lane views
        shell: bash
        run: |
          python - <<'PY'
          import json, os, time
          from pathlib import Path
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC

          target=os.environ['REVIEW_TARGET_SHA']
          base=os.environ['QA_WEB_BASE_URL'].rstrip('/')
          out=Path(os.environ['REVIEW_DIR'])
          out.mkdir(parents=True, exist_ok=True)

          opts=webdriver.ChromeOptions()
          for arg in ('--headless=new','--no-sandbox','--disable-dev-shm-usage','--disable-gpu','--force-device-scale-factor=1'):
              opts.add_argument(arg)
          opts.add_argument('--window-size=1440,1000')
          opts.binary_location=os.environ['BROWSER_BIN']
          driver=webdriver.Chrome(options=opts)
          wait=WebDriverWait(driver,25)
          shots=[]

          def metrics():
              return driver.execute_script("const r=document.documentElement; return {cw:r.clientWidth,sw:r.scrollWidth,sh:Math.max(r.scrollHeight,document.body.scrollHeight),h1:document.querySelectorAll('h1').length};")

          def save(name,width,min_height=900):
              time.sleep(.45)
              m=metrics(); overflow=m['sw']-m['cw']
              assert overflow <= 2, f'{name} {width}: horizontal overflow {overflow}'
              assert m['h1'] == 1, f'{name} {width}: expected 1 h1, got {m["h1"]}'
              height=min(max(int(m['sh'])+32,min_height),7000)
              driver.set_window_size(width,height)
              time.sleep(.15); driver.execute_script('window.scrollTo(0,0)')
              path=out/f'{name}-{width}.png'
              assert driver.save_screenshot(str(path))
              shots.append({'name':name,'width':width,'height':height,'overflow':overflow,'h1':m['h1'],'url':driver.current_url,'file':path.name})

          def hard(route):
              driver.get(base+route)

          def spa(route):
              driver.execute_script("window.history.pushState({}, '', arguments[0]); window.dispatchEvent(new PopStateEvent('popstate'));",route)
              wait.until(lambda d:d.current_url.startswith(base+route))

          try:
              for label,width,height in [('desktop',1440,1000),('mobile',390,844)]:
                  driver.set_window_size(width,height)
                  hard('/operator/login')
                  wait.until(EC.visibility_of_element_located((By.ID,'operator-login')))
                  assert driver.find_element(By.ID,'operator-login').get_attribute('autocomplete')=='username'
                  assert driver.find_element(By.ID,'operator-password').get_attribute('autocomplete')=='current-password'
                  session_contract=driver.find_element(By.CSS_SELECTOR,'.r3-login-session-note').get_attribute('textContent').lower()
                  assert 'sin renovación automática de sesión' in session_contract
                  save(f'operator-login-{label}',width,height)

              driver.set_window_size(1440,1000)
              hard('/operator/login')
              wait.until(EC.visibility_of_element_located((By.ID,'operator-login')))
              driver.find_element(By.ID,'operator-login').send_keys(os.environ['QA_ADMIN_LOGIN'])
              driver.find_element(By.ID,'operator-password').send_keys(os.environ['QA_OPERATOR_PASSWORD'])
              driver.find_element(By.CSS_SELECTOR,'button[type="submit"]').click()
              wait.until(lambda d:'/operator/' in d.current_url and '/operator/login' not in d.current_url)

              admin_routes=[
                  ('communication-templates','/operator/admin/communication-templates'),
                  ('custom-fields','/operator/admin/custom-fields'),
                  ('guidance','/operator/admin/guidance'),
                  ('pipelines','/operator/admin/pipelines'),
                  ('automations','/operator/admin/automations'),
                  ('imports','/operator/admin/imports'),
                  ('recovery','/operator/admin/recovery'),
              ]
              for name,route in admin_routes:
                  for width in (1440,390):
                      driver.set_window_size(width,1000 if width==1440 else 844)
                      spa(route)
                      wait.until(EC.visibility_of_element_located((By.TAG_NAME,'h1')))
                      time.sleep(.5)
                      assert '/operator/login' not in driver.current_url, f'{name} {width}: redirected to login'
                      save(name,width,1000 if width==1440 else 844)

              public_routes=[
                  ('public-home','/'),
                  ('public-claim-verify','/claims/new/verify'),
                  ('public-tracking','/claims/track'),
              ]
              for name,route in public_routes:
                  for width in (1440,390):
                      driver.set_window_size(width,1000 if width==1440 else 844)
                      hard(route)
                      wait.until(EC.visibility_of_element_located((By.TAG_NAME,'h1')))
                      body=driver.find_element(By.TAG_NAME,'body').text.lower()
                      assert 'caso técnico no oficial' in body, f'{name} {width}: missing public disclosure'
                      save(name,width,1000 if width==1440 else 844)
          finally:
              driver.quit()

          assert len(shots)==22, f'Expected 22 captures, got {len(shots)}'
          summary={
              'review_type':'r3_parallel_sync_visual_review_v2',
              'review_target_sha':target,
              'capture_count':len(shots),
              'max_horizontal_overflow':max(s['overflow'] for s in shots),
              'all_single_h1':all(s['h1']==1 for s in shots),
              'shots':shots,
              'result':'PASS',
          }
          (out/'visual-review.json').write_text(json.dumps(summary,indent=2),encoding='utf-8')
          print(json.dumps(summary,indent=2))
          PY

      - name: Assert no unhandled API errors
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'UNHANDLED_API_ERROR' "$REVIEW_DIR/api.log"; then
            cat "$REVIEW_DIR/api.log"
            exit 1
          fi

      - name: Upload exact-head visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r3-parallel-sync-visual-v2-${{ env.REVIEW_TARGET_SHA }}
          path: |
            .runtime/r3-parallel-sync-visual-v2/*.png
            .runtime/r3-parallel-sync-visual-v2/visual-review.json
            .runtime/r3-parallel-sync-visual-v2/api.log
            .runtime/r3-parallel-sync-visual-v2/web.log
            .runtime/r3-parallel-sync-visual-v2/legacy.log
          retention-days: 30

      - name: Stop review stack
        if: always()
        shell: bash
        run: |
          for pidfile in "$REVIEW_DIR"/*.pid; do
            [[ -f "$pidfile" ]] || continue
            kill "$(cat "$pidfile")" 2>/dev/null || true
          done
