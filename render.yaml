services:
  - type: web
    runtime: static
    name: insuranceclaims-demo-web
    branch: main
    autoDeployTrigger: commit
    domains:
      - claims.eliasworks.uy
    buildCommand: npm ci --include=dev && npm run build --workspace @insurance/web
    staticPublishPath: apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://api.claims.eliasworks.uy
